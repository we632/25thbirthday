<style>
:root{
  --bg:#050711;
  --text:#f2e8ff;
  --accent:rgba(232,205,255,.92);
  --modal:#140f27;
  --border:rgba(228,186,255,.3);
  --map-top:18vh;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Noto Serif SC',serif;}

#star-canvas,
#map,
#nebula{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
}
#star-canvas{z-index:0;pointer-events:none;}
#star-canvas{top:0;}
#map{z-index:1;overflow:hidden;isolation:isolate;}
#map{top:var(--map-top);}
#map::before{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(180deg, rgba(12,10,28,.34), rgba(16,12,38,.18) 46%, rgba(34,22,70,.3));
  mix-blend-mode:multiply;
}
#map::after{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 8%, rgba(248,239,255,.26) 0, rgba(248,239,255,.26) .65px, transparent .9px) 0 0/138px 138px,
    radial-gradient(circle at 76% 14%, rgba(244,224,255,.22) 0, rgba(244,224,255,.22) .55px, transparent .85px) 0 0/190px 190px,
    radial-gradient(circle at 14% 28%, rgba(248,239,255,.34) 0, rgba(248,239,255,.34) .7px, transparent .95px) 0 0/165px 165px,
    radial-gradient(circle at 72% 64%, rgba(244,224,255,.26) 0, rgba(244,224,255,.26) .6px, transparent .85px) 0 0/210px 210px,
    linear-gradient(180deg, rgba(121,88,204,.38), rgba(255,192,231,.2) 55%, rgba(82,58,148,.42)),
    radial-gradient(85vmax 52vmax at 20% 10%, rgba(166,132,255,.22), transparent 70%),
    radial-gradient(64vmax 46vmax at 86% 78%, rgba(255,174,226,.18), transparent 72%);
  mix-blend-mode:screen;
  opacity:.62;
}
#nebula{
  top:var(--map-top);
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(110vmax 58vmax at 9% 8%, rgba(137,103,238,.32), transparent 64%),
    radial-gradient(70vmax 42vmax at 84% 74%, rgba(255,160,218,.22), transparent 70%),
    radial-gradient(135vmax 62vmax at 40% 100%, rgba(58,42,103,.4), transparent 74%);
  mix-blend-mode:screen;
  opacity:.82;
}

#meteor-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:var(--map-top);
  min-height:120px;
  z-index:3;
  overflow:hidden;
  pointer-events:none;
  background:
    radial-gradient(120% 100% at 18% 20%, rgba(151,120,240,.3), transparent 60%),
    radial-gradient(120% 100% at 78% 10%, rgba(255,174,226,.2), transparent 55%),
    linear-gradient(to bottom, rgba(10,8,24,.1), rgba(10,8,24,.28));
}
#meteor-header::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(248,239,255,.42) 0 .7px, transparent .9px) 0 0/170px 170px,
    radial-gradient(circle at 74% 22%, rgba(242,226,255,.34) 0 .6px, transparent .85px) 0 0/210px 210px;
  opacity:.5;
}
#meteor-header::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom, rgba(9,8,24,.04), rgba(9,8,24,.28) 68%, rgba(9,8,24,0) 100%),
    radial-gradient(80% 100% at 50% 0%, rgba(255,197,231,.16), transparent 70%);
}

#meteors-layer{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  overflow:hidden;
  mix-blend-mode:screen;
  opacity:.82;
}
.meteor-streak{
  position:absolute;
  left:0;
  top:0;
  width:var(--len,180px);
  height:var(--thick,1.2px);
  border-radius:999px;
  background:linear-gradient(90deg, rgba(255,247,255,0) 0%, rgba(247,228,255,.5) 48%, rgba(255,255,255,.99) 100%);
  box-shadow:0 0 12px rgba(224,176,255,.28),0 0 26px rgba(255,197,231,.2);
  transform-origin:left center;
  animation:meteorGlide var(--dur,3200ms) cubic-bezier(.2,.08,.24,1) forwards;
}
.meteor-streak.catchable{
  pointer-events:auto;
  cursor:pointer;
  touch-action:manipulation;
}
.meteor-streak.catchable:hover{
  filter:brightness(1.12);
}
.meteor-streak.catchable.meteor-golden::before{
  content:'';
  position:absolute;
  inset:50% auto auto 100%;
  width:18px;
  height:18px;
  transform:translate(-58%, -50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,244,210,.28) 0 28%, rgba(255,220,150,.08) 58%, rgba(255,220,150,0) 78%);
  pointer-events:none;
}
.meteor-streak::after{
  content:'';
  position:absolute;
  right:-2px;
  top:50%;
  width:5px;
  height:5px;
  transform:translateY(-50%);
  border-radius:50%;
  background:rgba(255,255,255,.95);
  box-shadow:0 0 13px rgba(255,220,243,.66);
}
.meteor-catch-burst{
  position:fixed;
  left:0;
  top:0;
  width:16px;
  height:16px;
  margin-left:-8px;
  margin-top:-8px;
  border-radius:50%;
  pointer-events:none;
  z-index:680;
  background:radial-gradient(circle, rgba(255,255,255,.98) 0 20%, rgba(255,226,176,.84) 22% 42%, rgba(255,226,176,.1) 44%, transparent 72%);
  box-shadow:0 0 24px rgba(255,224,184,.44), 0 0 54px rgba(233,186,255,.26);
  animation:meteorCatchBurst .68s ease forwards;
}

#meteor-wish{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:680;
  width:min(360px, calc(100vw - 28px));
  opacity:0;
  transform:translateY(22px) scale(.98);
  pointer-events:none;
  transition:opacity .35s ease, transform .45s cubic-bezier(.2,.8,.24,1);
}
#meteor-wish.open{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
#meteor-wish-card{
  position:relative;
  padding:16px 16px 14px;
  border-radius:16px;
  border:1px solid rgba(236,201,255,.24);
  background:
    radial-gradient(100% 120% at 14% 0%, rgba(255,214,236,.14), transparent 48%),
    radial-gradient(90% 110% at 100% 100%, rgba(171,146,255,.12), transparent 42%),
    rgba(16,12,36,.9);
  box-shadow:0 18px 44px rgba(0,0,0,.3), inset 0 0 30px rgba(161,126,255,.08);
  backdrop-filter:blur(10px);
}
.meteor-wish-close{
  position:absolute;
  top:10px;
  right:10px;
  min-width:auto;
  padding:5px 10px;
  font-size:.72rem;
}
.meteor-wish-kicker{
  padding-right:72px;
  font-family:'Space Mono',monospace;
  font-size:.68rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,231,178,.82);
}
.meteor-wish-title{
  margin-top:6px;
  font-size:1rem;
  color:rgba(249,236,255,.96);
}
.meteor-wish-copy{
  margin-top:10px;
  color:rgba(242,226,255,.88);
  line-height:1.88;
  font-size:.88rem;
}
.meteor-wish-foot{
  margin-top:12px;
  font-size:.72rem;
  color:rgba(240,216,255,.58);
}

#clock-wrap{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:450;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:min(96vw, 1080px);
}
#clock{
  font-family:'Space Mono',monospace;
  font-size:clamp(15px,2.1vw,24px);
  letter-spacing:.08em;
  color:rgba(245,226,255,.86);
  text-shadow:0 0 14px rgba(189,133,246,.36),0 0 32px rgba(255,189,227,.2);
  user-select:none;
  pointer-events:none;
  white-space:nowrap;
}
.title-letter-heart-pin{
  appearance:none;
  border:none;
  width:40px;
  height:40px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:999px;
  font-size:19px;
  line-height:1;
  color:rgba(255,233,244,.96);
  background:
    radial-gradient(circle at 32% 28%, rgba(255,244,248,.96), rgba(255,221,236,.68) 20%, rgba(255,171,210,.36) 44%, rgba(115,73,152,.1) 74%, rgba(115,73,152,0) 78%),
    linear-gradient(135deg, rgba(255,201,226,.2), rgba(163,129,255,.18));
  box-shadow:
    0 10px 26px rgba(12,8,34,.22),
    0 0 18px rgba(255,196,226,.14),
    inset 0 0 0 1px rgba(255,239,246,.16);
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  transform:translateY(-4px) scale(.84);
  transition:opacity .45s ease, transform .55s cubic-bezier(.2,.82,.24,1), box-shadow .28s ease, filter .28s ease;
  filter:saturate(.96);
}
.title-letter-heart-pin:hover,
.title-letter-heart-pin:focus-visible{
  transform:translateY(-1px) scale(1.04);
  box-shadow:
    0 14px 30px rgba(12,8,34,.24),
    0 0 24px rgba(255,205,230,.22),
    inset 0 0 0 1px rgba(255,244,248,.26);
  filter:saturate(1.06) brightness(1.04);
  outline:none;
}
#clock-wrap.hearts-ready .title-letter-heart-pin{
  opacity:.96;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}
#clock.special{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:6px 16px 8px;
  border-radius:999px;
  white-space:normal;
  max-width:min(94vw,920px);
  background:
    linear-gradient(135deg, rgba(34,25,66,.44), rgba(78,56,126,.1) 48%, rgba(255,188,226,.06) 86%, rgba(56,40,92,.22)),
    radial-gradient(circle at 18% 20%, rgba(255,232,242,.08), transparent 44%);
  border:1px solid rgba(247,219,255,.1);
  box-shadow:
    0 10px 28px rgba(10,7,26,.18),
    inset 0 0 0 1px rgba(255,233,245,.04);
  backdrop-filter:blur(8px) saturate(1.04);
  isolation:isolate;
}
#clock.special::before,
#clock.special::after{
  content:'';
  position:absolute;
  top:50%;
  width:84px;
  height:18px;
  transform:translateY(-50%);
  opacity:.68;
  pointer-events:none;
  background:
    radial-gradient(circle, rgba(255,242,214,.72) 0 1.4px, transparent 1.8px) 10px 8px/18px 18px no-repeat,
    radial-gradient(circle, rgba(239,220,255,.46) 0 1.1px, transparent 1.6px) 52px 4px/16px 16px no-repeat,
    linear-gradient(90deg, rgba(255,231,196,0), rgba(255,231,196,.42) 44%, rgba(233,202,255,.36) 62%, rgba(233,202,255,0));
  filter:drop-shadow(0 0 10px rgba(255,214,232,.08));
}
#clock.special::before{
  left:-54px;
}
#clock.special::after{
  right:-54px;
  transform:translateY(-50%) scaleX(-1);
}
#clock-wrap.hearts-ready #clock.special::before{
  left:-44px;
}
#clock-wrap.hearts-ready #clock.special::after{
  right:-44px;
}
/* ===== 生日标题区三层元素入场动画 ===== */
/* chip：信封关闭/开场结束后浮现，golden bloom */
.clock-special-chip{
  flex:0 0 auto;
  padding:4px 8px;
  border-radius:999px;
  font-family:'Space Mono',monospace;
  font-size:clamp(9px,.82vw,11px);
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(255,236,206,.72);
  background:linear-gradient(135deg, rgba(255,205,150,.12), rgba(255,171,211,.08));
  border:1px solid rgba(255,230,196,.12);
  box-shadow:none;
  animation:clockChipBloom 1s cubic-bezier(.16,.8,.2,1.01) both;
  animation-delay:.38s;
}
/* 主标题：从雾中浮升而出 */
.clock-special-main{
  font-family:'Noto Serif SC',serif;
  font-size:clamp(22px,3vw,38px);
  letter-spacing:.02em;
  line-height:1.08;
  color:rgba(255,241,248,.92);
  text-shadow:
    0 0 14px rgba(204,150,255,.24),
    0 0 28px rgba(255,190,232,.08);
  animation:clockMainReveal 1.2s cubic-bezier(.2,.85,.22,1) both;
}
/* sweet-world subtitle */
.clock-special-name{
  flex:1 0 100%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-family:'Noto Serif SC',serif;
  font-size:clamp(14px,1.4vw,18px);
  letter-spacing:.08em;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transform:translateY(10px);
  transition:
    opacity 2.2s cubic-bezier(.2,.88,.24,1),
    transform 2.2s cubic-bezier(.2,.88,.24,1),
    letter-spacing 2s ease,
    color 2s ease,
    text-shadow 2s ease;
}
/* 两侧装饰线 + 星星 */
.clock-special-name::before,
.clock-special-name::after{
  content:'✦';
  flex-shrink:0;
  font-family:'Space Mono',monospace;
  font-size:.7em;
  color:rgba(255,212,236,.88);
  text-shadow:0 0 10px rgba(255,194,232,.7), 0 0 18px rgba(204,168,255,.4);
  animation:sweetStarTwinkle 3.2s ease-in-out infinite;
}
.clock-special-name::after{
  animation-delay:1.4s;
}
/* 横线：hearts-ready 后从0延伸出来 */
.clock-special-name-line{
  flex-shrink:0;
  display:inline-block;
  width:0;
  height:1px;
  opacity:0;
  background:linear-gradient(90deg, rgba(255,210,232,0), rgba(255,210,232,.66) 50%, rgba(208,176,255,.5) 100%);
  transition:width 1.6s cubic-bezier(.2,.88,.24,1), opacity .5s ease;
}
.clock-special-name-line.r{
  background:linear-gradient(270deg, rgba(255,210,232,0), rgba(255,210,232,.66) 50%, rgba(208,176,255,.5) 100%);
}
@keyframes sweetStarTwinkle{
  0%,100%{ opacity:.52; transform:scale(.9) rotate(0deg); }
  50%    { opacity:1;   transform:scale(1.18) rotate(20deg); }
}
@keyframes clockChipBloom{
  0%  { opacity:0; transform:scale(.66) translateY(6px); filter:blur(7px); letter-spacing:.04em; }
  58% { opacity:1; transform:scale(1.1) translateY(-2px); filter:blur(0); letter-spacing:.22em; }
  100%{ opacity:1; transform:scale(1) translateY(0); letter-spacing:.18em; }
}
@keyframes clockMainReveal{
  0%  { opacity:0; transform:translateY(12px); filter:blur(10px); }
  62% { opacity:1; transform:translateY(-3px); filter:blur(0); }
  100%{ opacity:1; transform:translateY(0); }
}
/* subtitle 浮现：letter-spacing 像呼气一样从窄缓缓展开 */
#clock-wrap.hearts-ready .clock-special-name{
  opacity:.86;
  pointer-events:auto;
  transform:translateY(0);
  letter-spacing:.28em;
  color:rgba(255,228,244,.92);
  text-shadow:
    0 0 18px rgba(255,188,226,.36),
    0 0 36px rgba(204,168,255,.18);
  transition-delay:.9s;
}
/* 横线在 subtitle 文字出现后再延伸出来 */
#clock-wrap.hearts-ready .clock-special-name-line{
  width:clamp(22px,3.2vw,50px);
  opacity:1;
  transition-delay:2.4s;
}

.leaflet-container{background:transparent;}
.leaflet-tile-pane{
  opacity:.93;
  filter:saturate(.76) contrast(1.04) brightness(.93) hue-rotate(190deg);
}
.leaflet-control-container{opacity:.55;transition:opacity .25s ease;}
.leaflet-control-container:hover{opacity:.9;}
.leaflet-control-zoom a{
  background:rgba(27,22,50,.86)!important;
  border:1px solid rgba(228,186,255,.28)!important;
  color:rgba(241,218,255,.84)!important;
}

.treasure-dot{
  width:14px;
  height:14px;
  border:none;
  border-radius:50%;
  background:transparent;
  padding:0;
  cursor:pointer;
  position:relative;
}
.treasure-dot::before,
.treasure-dot::after{
  content:'';
  position:absolute;
  left:50%;
  top:50%;
  border-radius:50%;
  transform:translate(-50%,-50%);
}
.treasure-dot::before{
  width:2px;
  height:2px;
  background:rgba(236,215,255,.42);
  box-shadow:0 0 4px rgba(232,176,255,.2);
  animation:whisper 11s ease-in-out infinite;
}
.treasure-dot::after{
  width:9px;
  height:9px;
  background:radial-gradient(circle, rgba(236,187,255,.1) 0%, rgba(236,187,255,0) 72%);
  opacity:.18;
  animation:fadeHalo 13s ease-in-out infinite;
}
.treasure-dot.locked{
  cursor:not-allowed;
}
.treasure-dot.locked::before{
  background:rgba(236,215,255,.16);
  box-shadow:none;
  animation:none;
}
.treasure-dot.locked::after{
  opacity:.08;
  animation:none;
}
/* 生日后按顺序等待中的站点：视觉暗淡但不同于 pre-birthday 锁 */
.treasure-dot.seq-locked{
  cursor:not-allowed;
}
.treasure-dot.seq-locked::before{
  background:rgba(236,215,255,.22);
  box-shadow:none;
  animation:whisper 18s ease-in-out infinite;
}
.treasure-dot.seq-locked::after{
  opacity:.06;
  animation:none;
}
.treasure-dot.current::before{
  width:4px;
  height:4px;
  background:rgba(255,244,255,.96);
  box-shadow:0 0 10px rgba(255,212,245,.55),0 0 20px rgba(208,164,255,.26);
}
.treasure-dot.current::after{
  width:14px;
  height:14px;
  opacity:.42;
  animation:fadeHalo 4.6s ease-in-out infinite;
}
.treasure-dot.opened::before{
  width:3px;
  height:3px;
  background:rgba(242,230,255,.8);
  box-shadow:0 0 6px rgba(237,195,255,.34);
}
.treasure-dot.opened::after{
  opacity:.24;
}

.map-star{
  position:relative;
  display:block;
  width:3px;
  height:3px;
  border-radius:50%;
  background:rgba(246,233,255,var(--o,.64));
  box-shadow:0 0 7px rgba(226,175,255,.28),0 0 14px rgba(255,205,235,.12);
  animation:mapStarPulse var(--dur,7.2s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
.map-star::after{
  content:'';
  position:absolute;
  left:50%;
  top:50%;
  width:11px;
  height:11px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(230,184,255,.17) 0%, rgba(230,184,255,0) 72%);
}
.map-star.s{width:2px;height:2px;}
.map-star.m{width:3px;height:3px;}
.map-star.l{
  width:4px;
  height:4px;
  box-shadow:0 0 9px rgba(226,175,255,.35),0 0 20px rgba(255,205,235,.16);
}

#modal-bg{
  position:fixed;
  inset:0;
  z-index:700;
  background:rgba(10,7,24,.66);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}
#modal-bg.open{display:flex;}
#lightbox-bg{
  position:fixed;
  inset:0;
  z-index:920;
  background:rgba(6,5,16,.88);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}
#lightbox-bg.open{display:flex;}
#lightbox-card{
  position:relative;
  max-width:min(1100px,96vw);
  max-height:92vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.lightbox-close{
  align-self:flex-end;
}
#lightbox-image{

.game-wrap{

.game-row{

.game-row input{
  flex:1;
  border:1px solid rgba(228,186,255,.26);
  border-radius:6px;
  background:rgba(18,13,37,.74);
  color:rgba(244,232,255,.96);

}
.game-row button{
  border:1px solid rgba(228,186,255,.32);

  color:rgba(245,220,255,.95);
  font-family:'Space Mono',monospace;
  padding:9px 14px;
  cursor:pointer;
}
.game-result{
  margin-top:10px;
  min-height:20px;
  font-size:.84rem;
  color:rgba(240,214,255,.82);
  opacity:0;
  transition:opacity 1.2s ease;
}
.game-reveal{
  display:none;
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed rgba(228,186,255,.18);
}
/* 解锁后先让 reveal 出现（不可见），等金字符雨结束再淡入 */
.game-wrap.unlocked .game-reveal{
  display:block;
  animation:none;
  opacity:0;
  transition:opacity 1.4s ease .4s;
}
.game-wrap.reward-ready .game-reveal{
  opacity:1;
}
.game-wrap.reward-ready .game-result{
  opacity:1;
}
/* 输对暗号后隐藏输入行 + 提示文字；game-result 获得 text-typewriter 后不受影响 */
.game-wrap.unlocked .game-row,
.game-wrap.unlocked > .text-typewriter:not(.game-result){
  display:none;
}
/* ===== 金色字符雨覆盖层 ===== */
.gold-char-rain{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:980;
  overflow:hidden;
}
.gold-char-rain span{
  position:absolute;
  top:-2.5em;
  display:block;
  font-family:'Space Mono',monospace;
  text-shadow:0 0 10px rgba(255,210,80,.7), 0 0 22px rgba(255,178,48,.5), 0 0 38px rgba(255,220,130,.28);
  animation:goldCharFall linear forwards;
  will-change:transform,opacity;
}
.gold-char-rain.rain-fade{
  animation:goldRainOut .65s ease forwards;
}
@keyframes goldCharFall{
  0%  { opacity:0;    transform:translateY(0)      rotate(0deg)   scale(1); }
  8%  { opacity:1; }
  82% { opacity:.9; }
  100%{ opacity:0;    transform:translateY(110vh)   rotate(420deg) scale(.8); }
}
@keyframes goldRainOut{
  to{ opacity:0; }
}

  grid-template-columns:var(--tray-around-piece) minmax(0, calc(var(--tray-around-piece) * 3 + var(--tray-around-gap) * 2)) var(--tray-around-piece);
  grid-template-rows:auto auto;
  grid-template-areas:
    "top top top"
    "left stage right";
  justify-content:center;
  align-items:center;

  align-content:center;
}
.jigsaw-wrap.tray-around .jigsaw-tray-top{
  grid-template-columns:repeat(var(--tray-columns, 3), minmax(0, var(--tray-around-piece)));
  justify-content:center;
}
.jigsaw-wrap.tray-around .jigsaw-tray-left,
.jigsaw-wrap.tray-around .jigsaw-tray-right{

.jigsaw-tray-right{

}
.jigsaw-tray-left{

}

  grid-row:1;
}
.jigsaw-tray-floor{

}
.jigsaw-wrap.tray-around.settled .jigsaw-tray-top,
.jigsaw-wrap.tray-around.settled .jigsaw-tray-left,
.jigsaw-wrap.tray-around.settled .jigsaw-tray-right{
  opacity:0;
  pointer-events:none;
}
.jigsaw-wrap.tray-around.settled .jigsaw-tray-top{
  transform:translateY(-18px) scale(.98);
}
.jigsaw-wrap.tray-around.settled .jigsaw-tray-left{
  transform:translateX(-18px) scale(.98);
}
.jigsaw-wrap.tray-around.settled .jigsaw-tray-right{
  transform:translateX(18px) scale(.98);
}
.jigsaw-fireworks{
  position:absolute;
  inset:-6px;
  width:calc(100% + 12px);
  height:calc(100% + 12px);
  pointer-events:none;
  z-index:4;
}
.jigsaw-pop{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.92);
  width:min(86%, 460px);
  padding:11px 12px;
  border-radius:10px;
  border:1px solid rgba(245,221,255,.28);
  background:rgba(26,16,54,.64);
  color:rgba(250,236,255,.96);
  text-align:center;
  line-height:1.85;
  font-size:.84rem;
  opacity:0;
  pointer-events:none;
  backdrop-filter:blur(2px);
  z-index:5;
}
.jigsaw-wrap.completed .jigsaw-pop{
  animation:jigPop 2.6s ease;
}
.jigsaw-status{
  margin-top:8px;
  font-size:.74rem;
  color:rgba(235,205,255,.78);
}
.jigsaw-reveal{
  margin-top:10px;
  padding:10px 11px;
  border:1px solid rgba(230,188,255,.24);
  border-radius:8px;
  background:rgba(255,255,255,.03);
  color:rgba(247,232,255,.94);
  line-height:1.85;
  font-size:.86rem;
  display:none;
}
.jigsaw-wrap.completed .jigsaw-reveal{
  display:block;
  animation:jigReveal .56s ease;
}
.jigsaw-reveal-copy{
  padding:12px 14px;
  border-radius:10px;
  border:1px solid rgba(236,204,255,.18);
  background:
    radial-gradient(120% 100% at 8% 0%, rgba(255,207,234,.1), transparent 56%),
    radial-gradient(90% 90% at 100% 100%, rgba(176,144,255,.08), transparent 58%),
    rgba(18,12,39,.42);
  color:rgba(248,233,255,.9);
  line-height:1.95;
  font-size:.84rem;
  text-align:left;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.jigsaw-gallery{
  margin-top:12px;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.jigsaw-gallery img{
  display:block;
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:8px;
  border:1px solid rgba(234,203,255,.22);
  box-shadow:0 10px 24px rgba(0,0,0,.16);
}

@keyframes jigReveal{
  0%{opacity:0;transform:translateY(6px);}
  100%{opacity:1;transform:translateY(0);}
}
@keyframes jigsawWrong{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  50%{transform:translateX(4px);}
  75%{transform:translateX(-2px);}
}
@keyframes constellationWrong{
  0%,100%{transform:translate(-50%,-50%) scale(1);}
  35%{transform:translate(-50%,-50%) scale(.84);}
  68%{transform:translate(-50%,-50%) scale(1.16);}
}
@keyframes jigPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.92);}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  80%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-52%) scale(1);}
}
@keyframes typeCaret{
  0%,48%{opacity:1;}
  49%,100%{opacity:0;}
}
@keyframes flameFlicker{
  0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg);}
  42%{transform:translateX(-50%) scale(1.08,.95) rotate(1deg);}
  68%{transform:translateX(-50%) scale(.94,1.07) rotate(-1deg);}
}
@keyframes whisper{
  0%,100%{opacity:.42;transform:translate(-50%,-50%) scale(.88);} 
  50%{opacity:.8;transform:translate(-50%,-50%) scale(1.08);} 
}
@keyframes fadeHalo{
  0%,100%{opacity:.16;}
  50%{opacity:.04;}
}
@keyframes meteorCatchBurst{
  0%{
    opacity:.12;
    transform:scale(.34);
  }
  38%{
    opacity:1;
    transform:scale(1.28);
  }
  100%{
    opacity:0;
    transform:scale(2.2);
  }
}
@keyframes mapStarPulse{
  0%,100%{opacity:.22;transform:scale(.84);}
  45%{opacity:var(--o,.64);transform:scale(1);}
  62%{opacity:1;transform:scale(1.16);}
}
@keyframes meteorGlide{
  0%{
    opacity:0;
    transform:translate3d(var(--sx,-18vw),var(--sy,10vh),0) rotate(var(--ang,22deg)) scaleX(.5);
  }
  12%{opacity:var(--op,.82);}
  76%{opacity:calc(var(--op,.82)*.64);}
  100%{
    opacity:0;
    transform:translate3d(var(--ex,124vw),var(--ey,62vh),0) rotate(var(--ang,22deg)) scaleX(1);
  }
}

@media (max-width:720px){
  :root{--map-top:21vh;}
  #clock{top:12px;letter-spacing:.04em;font-size:clamp(13px,3.8vw,18px);}
  #clock.special{
    gap:6px 8px;
    padding:6px 12px 8px;
    border-radius:24px;
  }
  #clock.special::before,
  #clock.special::after{
    width:44px;
    height:14px;
    opacity:.48;
  }
  #clock.special::before{ left:-10px; }
  #clock.special::after{ right:-10px; }
  .clock-special-chip{
    padding:3px 7px;
    font-size:9px;
    letter-spacing:.12em;
  }
  .clock-special-main{
    font-size:clamp(17px,4.9vw,27px);
  }
  .clock-special-name{
    font-size:clamp(12px,3.4vw,16px);
    letter-spacing:.2em;
  }
  .photo-gallery{grid-template-columns:repeat(2,minmax(0,1fr));}
  .typewriter-stage{min-height:260px;}
  .typewriter-output{font-size:.9rem;line-height:1.95;min-height:158px;}
  .wish-candle{transform:translateX(-50%) scale(.88);bottom:4%;}
  .wish-gallery{grid-template-columns:repeat(2,minmax(0,1fr));}
  .mm-complete-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .memory-layout{grid-template-columns:1fr;}
  .mm-gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .memory-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .jigsaw-gallery{grid-template-columns:repeat(2,minmax(0,1fr));}
  .inline-media-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .constellation-stage{min-height:320px;}
  .constellation-star-meta{
    max-width:min(42vw, 152px);
    padding:5px 8px 4px;
  }
  .constellation-star-name{font-size:.56rem;}
  .constellation-star-tag{font-size:.6rem;}
  .jigsaw-board{grid-template-columns:1fr;}
  .jigsaw-tray{grid-template-columns:repeat(3,minmax(0,1fr));}
  .jigsaw-wrap.tray-around{
    --tray-around-piece:calc((100% - 24px) / 3);
  }
  .jigsaw-wrap.tray-around .jigsaw-board{
    grid-template-columns:1fr;
    grid-template-areas:
      "top"
      "stage"
      "left"
      "right";
    gap:10px;
  }
  .jigsaw-wrap.tray-around .jigsaw-stage{
    width:100%;
  }
  .jigsaw-wrap.tray-around .jigsaw-tray-top,
  .jigsaw-wrap.tray-around .jigsaw-tray-left,
  .jigsaw-wrap.tray-around .jigsaw-tray-right{
    grid-column:1;
    grid-row:auto;
    width:100%;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,var(--tray-around-piece)));
    justify-content:center;
  }
  #meteor-wish{
    right:14px;
    left:14px;
    bottom:14px;
    width:auto;
  }
  .leaflet-control-container{display:none;}
}

/* ── GPU-layer promotion & paint-scope hints (purely additive, no visual change) ── */
#star-canvas,
#meteors-layer,
#nebula,
#meteor-header{
  transform:translateZ(0);
  backface-visibility:hidden;
}
#meteors-layer{
  contain:strict;
}
#modal-bg,
#lightbox-bg{
  contain:layout style;
}
.meteor-streak{
  will-change:transform,opacity;
}
.wish-flame{
  will-change:transform,opacity;
}
.mm-complete-inner,
.mm-inner{
  will-change:transform;
}
.map-star{
  will-change:opacity,transform;
}
.treasure-dot::before,
.treasure-dot::after{
  will-change:opacity,transform;
}

/* =====================================================
 生日开场：黑屏 → 真实时间倒数 → 巧克力蛋糕（5 根蜡烛）
   → 吹灭 → 烟花 + MP3 → 地图浮现
   ===================================================== */
#birthday-intro{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#030208;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:1;
  transition:opacity 1.8s ease;
  will-change:opacity;
}
#birthday-intro.hidden{opacity:0;pointer-events:none;}
#birthday-intro.gone{display:none;}
#birthday-intro::before{
  content:'';
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(circle at 26% 18%, rgba(188,124,255,.2), transparent 50%),
    radial-gradient(circle at 74% 78%, rgba(255,176,236,.16), transparent 55%),
    radial-gradient(circle at 50% 50%, rgba(14,8,28,.9), #030208 72%);
  animation:bdNebulaDrift 22s ease-in-out infinite alternate;
}
#birthday-intro::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 12% 22%, rgba(255,255,255,.55) 0 .7px, transparent 1.2px) 0 0/180px 180px,
    radial-gradient(circle at 78% 40%, rgba(255,236,220,.42) 0 .55px, transparent 1px) 0 0/220px 220px,
    radial-gradient(circle at 38% 82%, rgba(230,200,255,.5) 0 .6px, transparent 1.1px) 0 0/260px 260px;
  opacity:.68;
  pointer-events:none;
  animation:bdStarTwinkle 9s ease-in-out infinite alternate;
}
@keyframes bdNebulaDrift{
  0%{transform:translate3d(-2%,-2%,0) scale(1);}
  100%{transform:translate3d(3%,2%,0) scale(1.06);}
}
@keyframes bdStarTwinkle{
  0%{opacity:.4;}
  100%{opacity:.85;}
}
.bd-intro-skip{
  position:absolute;
  right:20px;
  bottom:18px;
  z-index:3;
  font-family:'Space Mono',monospace;
  font-size:12px;
  letter-spacing:.18em;
  color:rgba(238,214,255,.58);
  background:transparent;
  border:1px solid rgba(238,214,255,.26);
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
  transition:color .3s ease, border-color .3s ease, background .3s ease;
}
.bd-intro-skip:hover{
  color:rgba(255,240,220,.94);
  border-color:rgba(255,220,240,.7);
  background:rgba(255,220,240,.08);
}
.bd-intro-stage{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:32px 20px;
}
/* --- Phase 1: 倒数 --- */
.bd-phase{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:32px 20px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.42s ease;
}
.bd-phase.active{
  opacity:1;
  pointer-events:auto;
}
.bd-count-kicker{
  font-family:'Space Mono',monospace;
  font-size:clamp(11px,1.2vw,14px);
  letter-spacing:.5em;
  text-transform:uppercase;
  color:rgba(238,214,255,.66);
  margin-bottom:8px;
}
.bd-count-title{
  font-family:'Noto Serif SC',serif;
  font-size:clamp(16px,2vw,22px);
  color:rgba(248,232,255,.86);
  opacity:.82;
  letter-spacing:.1em;
}
.bd-count-number{
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:clamp(150px,26vw,320px);
  line-height:1;
  color:rgba(255,246,232,.96);
  text-shadow:
    0 0 22px rgba(255,212,160,.55),
    0 0 66px rgba(255,172,232,.38),
    0 0 130px rgba(188,124,255,.32);
  animation:bdNumberPulse 1s cubic-bezier(.2,.8,.24,1);
}
.bd-count-number.final{
  animation:bdNumberBurst 1.2s cubic-bezier(.2,.8,.24,1) forwards;
}
@keyframes bdNumberPulse{
  0%{transform:scale(2.2);opacity:0;filter:blur(22px);letter-spacing:.3em;}
  38%{opacity:1;filter:blur(0);letter-spacing:.04em;}
  100%{transform:scale(1);opacity:.94;letter-spacing:.04em;}
}
@keyframes bdNumberBurst{
  0%{transform:scale(1);opacity:1;filter:blur(0);}
  60%{transform:scale(1.6);opacity:.7;filter:blur(3px);}
  100%{transform:scale(3);opacity:0;filter:blur(28px);}
}
.bd-count-ring{
  position:absolute;
  width:min(58vmin,520px);
  height:min(58vmin,520px);
  border-radius:50%;
  border:1px dashed rgba(255,220,240,.16);
  animation:bdRingSpin 24s linear infinite;
}
.bd-count-ring.b{
  width:min(40vmin,360px);
  height:min(40vmin,360px);
  border-color:rgba(188,124,255,.22);
  animation-direction:reverse;
  animation-duration:18s;
}
@keyframes bdRingSpin{
  0%{transform:rotate(0);}
  100%{transform:rotate(360deg);}
}

/* --- Phase 2: 蛋糕 --- */
.bd-cake-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  transform:translateY(30px) scale(.94);
  transition:transform 0.72s cubic-bezier(.2,.9,.24,1.02);
}
.bd-phase.active .bd-cake-wrap{transform:translateY(0) scale(1);}
.bd-phase-cake.blown .bd-cake-wrap{transform:translateY(0) scale(1.035);}
.bd-phase-cake.blown .bd-cake-svg{
  filter:
    drop-shadow(0 24px 48px rgba(0,0,0,.56))
    drop-shadow(0 0 28px rgba(255,194,136,.16))
    drop-shadow(0 0 44px rgba(255,156,214,.1));
}
.bd-phase-cake.blown .bd-cake-caption,
.bd-phase-cake.blown .bd-cake-status{
  color:rgba(255,241,225,.96);
  text-shadow:
    0 0 14px rgba(255,188,128,.24),
    0 0 24px rgba(255,162,225,.16);
}
#birthday-intro.celebrating .bd-phase-cake.blown .bd-cake-wrap{
  transform:translateY(0) scale(1.075);
}
.bd-cake-svg{
  width:clamp(280px,46vw,460px);
  height:auto;
  filter:drop-shadow(0 22px 40px rgba(0,0,0,.55)) drop-shadow(0 4px 10px rgba(120,60,40,.35));
}
.bd-cake-caption{
  font-family:'Noto Serif SC',serif;
  font-size:clamp(15px,1.6vw,19px);
  letter-spacing:.16em;
  color:rgba(248,232,255,.92);
  text-shadow:0 0 14px rgba(255,190,220,.35);
}
.bd-cake-controls{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  justify-content:center;
}
.bd-cake-start{
  font-family:'Space Mono',monospace;
  font-size:13px;
  letter-spacing:.22em;
  text-transform:uppercase;
  padding:12px 22px;
  border-radius:999px;
  border:1px solid rgba(255,210,236,.46);
  background:linear-gradient(135deg, rgba(255,190,220,.18), rgba(188,124,255,.14));
  color:rgba(255,246,232,.94);
  cursor:pointer;
  backdrop-filter:blur(8px);
  transition:border-color .3s, background .3s, transform .3s;
}
.bd-cake-start:hover{
  border-color:rgba(255,238,250,.9);
  background:linear-gradient(135deg, rgba(255,200,230,.3), rgba(200,150,255,.24));
  transform:translateY(-1px);
}
.bd-cake-start:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}
.bd-cake-status{
  font-family:'Noto Serif SC',serif;
  font-size:13px;
  color:rgba(238,214,255,.76);
  min-height:1.2em;
  letter-spacing:.06em;
  text-align:center;
  padding:0 10px;
}
.bd-cake-meter{
  position:relative;
  width:min(440px,80vw);
  height:6px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
  border:1px solid rgba(255,220,240,.16);
}
.bd-cake-meter-fill{
  position:absolute;
  inset:0;
  width:4%;
  background:linear-gradient(90deg, #ffb05a, #ff8cc1 50%, #bc7cff);
  transition:width .2s ease;
  box-shadow:0 0 14px rgba(255,172,210,.55);
}
/* 5 蜡烛与火苗 */
.bd-flame{
  transform-origin:center bottom;
  transform-box:fill-box;
  animation:bdFlameFlicker 1.8s ease-in-out infinite alternate;
  transition:opacity .6s ease, transform .6s ease;
}
.bd-flame.out{
  opacity:0 !important;
  transform:scaleY(.1) !important;
  animation:none !important;
}
@keyframes bdFlameFlicker{
  0%  {transform:scale(1) translateY(0);opacity:.96;}
  30% {transform:scale(1.06,.92) translateY(-1px);opacity:1;}
  55% {transform:scale(.92,1.1) translateY(1px);opacity:.86;}
  100%{transform:scale(1.04,.96) translateY(0);opacity:.98;}
}
.bd-smoke{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.65), rgba(255,255,255,0));
  opacity:0;
  pointer-events:none;
  animation:bdSmokePuff 1.6s ease-out forwards;
}
@keyframes bdSmokePuff{
  0%{opacity:.7;transform:translateY(0) scale(.6);}
  100%{opacity:0;transform:translateY(-60px) scale(2.2);}
}
.bd-cake-confetti-layer{
  position:fixed;
  inset:0;
  z-index:2;
  overflow:hidden;
  pointer-events:none;
  opacity:0;
  transition:opacity .38s ease;
}
.bd-cake-confetti-layer.active{
  opacity:1;
}
.bd-cake-confetti{
  position:absolute;
  left:var(--left,50%);
  top:-14vh;
  width:var(--w,10px);
  height:var(--h,22px);
  opacity:0;
  border-radius:3px;
  background:var(--bg, linear-gradient(180deg,#ffe7a8,#ff91c6));
  transform:translate3d(0,0,0) rotate(0deg) scale(.88);
  animation:bdCakeConfettiFall var(--dur,4200ms) cubic-bezier(.18,.74,.2,1) var(--delay,0ms) forwards;
  will-change:transform,opacity;
  box-shadow:0 0 10px rgba(255,214,186,.12);
}
.bd-cake-confetti.ribbon{
  border-radius:999px;
  width:calc(var(--w,10px) * .56);
}
.bd-cake-confetti.flake{
  border-radius:50%;
  width:var(--w,12px);
  height:var(--w,12px);
  box-shadow:0 0 12px rgba(255,225,190,.18);
}
@keyframes bdCakeConfettiFall{
  0%{
    opacity:0;
    transform:translate3d(0,-4vh,0) rotate(0deg) scale(.82);
  }
  8%{
    opacity:.96;
  }
  100%{
    opacity:.9;
    transform:translate3d(var(--drift,0px),118vh,0) rotate(var(--spin,540deg)) scale(1.04);
  }
}

/* --- Phase 3: 烟花 --- */
.bd-fireworks{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:3;
  pointer-events:none;
  /* GPU compositing: 让烟花 canvas 独立分层、不拖累页面其它部分 */
  transform:translateZ(0);
  will-change:transform;
  contain:strict;
  backface-visibility:hidden;
}
.bd-celebrate-layer{
  position:fixed;
  inset:0;
  z-index:4;
  overflow:hidden;
  pointer-events:none;
  opacity:0;
  transition:opacity .45s ease;
}
.bd-celebrate-layer.active{opacity:1;}
.bd-celebrate-piece{
  position:absolute;
  left:var(--left,50%);
  bottom:-12vh;
  width:var(--size,14px);
  height:var(--size,14px);
  opacity:0;
  transform:translate3d(0,0,0) rotate(0deg) scale(.72);
  animation:bdCelebrateRise var(--dur,3600ms) linear var(--delay,0ms) forwards;
  will-change:transform,opacity;
}
.bd-celebrate-piece.orb{
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.98) 0 20%, rgba(255,218,162,.88) 38%, rgba(255,171,212,.42) 66%, rgba(255,171,212,0) 100%);
  box-shadow:
    0 0 18px rgba(255,218,162,.34),
    0 0 34px rgba(255,171,212,.18);
}
.bd-celebrate-piece.diamond{
  border-radius:3px;
  background:linear-gradient(135deg, rgba(255,247,226,.98), rgba(255,194,136,.9) 48%, rgba(196,150,255,.72));
  box-shadow:
    0 0 18px rgba(255,205,146,.28),
    0 0 28px rgba(196,150,255,.14);
}
.bd-celebrate-piece.streak{
  width:calc(var(--size,14px) * .42);
  height:calc(var(--size,14px) * 2.5);
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,212,146,.82) 48%, rgba(255,165,217,0));
  box-shadow:0 0 20px rgba(255,210,160,.3);
}
@keyframes bdCelebrateRise{
  0%{
    opacity:0;
    transform:translate3d(0,0,0) rotate(0deg) scale(.72);
  }
  10%{
    opacity:.96;
  }
  58%{
    opacity:.92;
  }
  100%{
    opacity:0;
    transform:translate3d(var(--drift,0px),-98vh,0) rotate(var(--spin,180deg)) scale(1.08);
  }
}

/* =====================================================
   金色流星（费城专用）
   ===================================================== */
.meteor-streak.meteor-golden{
  background:linear-gradient(90deg,
    rgba(255,210,110,0) 0%,
    rgba(255,230,160,.56) 42%,
    rgba(255,240,190,.96) 74%,
    #ffe38a 100%);
  box-shadow:
    0 0 12px rgba(255,210,120,.52),
    0 0 26px rgba(255,180,80,.28),
    0 0 52px rgba(255,230,170,.16);
  height:calc(var(--thick,1.2px) * 1.35);
  filter:saturate(1.08);
}
.meteor-streak.meteor-golden::after{
  width:8px;
  height:8px;
  right:-3px;
  background:radial-gradient(circle, #fff6d2 0 30%, #ffd878 50%, rgba(255,200,100,0) 85%);
  box-shadow:
    0 0 12px rgba(255,220,140,.82),
    0 0 24px rgba(255,180,80,.42);
}
.meteor-streak.meteor-golden::before{
  content:'';
  position:absolute;
  right:-12px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,220,140,.22), rgba(255,180,80,0) 72%);
  pointer-events:none;
  animation:bdGoldPulse 1.6s ease-in-out infinite alternate;
}
@keyframes bdGoldPulse{
  0%{opacity:.6;transform:translateY(-50%) scale(.9);}
  100%{opacity:1;transform:translateY(-50%) scale(1.3);}
}

/* =====================================================
   石家庄 · 天灯过场（自然降落版）
   ===================================================== */
#lantern-bridge{
  position:fixed;
  inset:0;
  z-index:615;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.1s ease;
  background:transparent;
}
#lantern-bridge.active{
  opacity:1;
  /* 保持 pointer-events:none —— 融入主屏幕，不拦截交互 */
  pointer-events:none;
}
#lantern-bridge::before{
  /* 不再需要背景颗粒，保留占位避免旧引用 */
  content:none;
}
.lantern-bridge-copy{
  display:none;
}
.lantern-bridge-stage{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.lantern-bridge-lantern{
  position:absolute;
  width:64px;
  height:92px;
  top:var(--land-top,82%);
  left:var(--land-left,50%);
  transform:translate(-50%,-50%);
  border:0;
  padding:0;
  background:transparent;
  appearance:none;
  pointer-events:none;
  will-change:transform,opacity,filter;
  animation:lanternDescend var(--descend-duration,5.2s) cubic-bezier(.33,.02,.28,1) var(--descend-delay,0s) both;
}
.lantern-bridge-lantern.landed:not(.released){
  animation:lanternBob 3.8s ease-in-out infinite;
  pointer-events:auto;
  cursor:pointer;
}
.lantern-bridge-lantern.released{
  animation:lanternRiseAway 5.2s cubic-bezier(.34,.04,.2,1) forwards !important;
}
.lantern-bridge-lantern-shell{
  position:absolute;
  inset:14px 12px 8px;
  border-radius:40% 40% 32% 32% / 34% 34% 52% 52%;
  background:
    radial-gradient(circle at 50% 34%, rgba(255,249,219,.88), rgba(255,212,137,.72) 34%, rgba(255,162,88,.44) 64%, rgba(255,128,74,.16) 88%, rgba(255,128,74,0) 100%),
    linear-gradient(180deg, rgba(255,223,145,.42), rgba(252,150,92,.12));
  box-shadow:0 0 22px rgba(255,186,102,.34), 0 0 58px rgba(255,155,87,.18);
  overflow:hidden;
}
.lantern-bridge-lantern-shell::before,
.lantern-bridge-lantern-shell::after{
  content:'';
  position:absolute;
  top:10px;
  bottom:10px;
  width:1px;
  background:rgba(150,96,54,.36);
}
.lantern-bridge-lantern-shell::before{ left:16px; }
.lantern-bridge-lantern-shell::after{ right:16px; }
.lantern-bridge-lantern-core{
  position:absolute;
  left:50%;
  top:48%;
  width:40px;
  height:54px;
  transform:translate(-50%,-50%);
  border-radius:42% 42% 34% 34% / 38% 38% 60% 60%;
  background:linear-gradient(180deg, rgba(255,242,205,.95), rgba(255,202,118,.82) 48%, rgba(245,136,90,.58) 100%);
  box-shadow:inset 0 0 16px rgba(255,255,255,.26);
}
.lantern-bridge-lantern-flame{
  position:absolute;
  left:50%;
  bottom:24px;
  width:12px;
  height:18px;
  transform:translateX(-50%);
  background:radial-gradient(circle at 50% 62%, rgba(255,248,205,.98), rgba(255,204,102,.82) 42%, rgba(255,132,72,.18) 76%, rgba(255,132,72,0) 100%);
  clip-path:polygon(50% 0%, 66% 24%, 84% 58%, 50% 100%, 16% 58%, 34% 24%);
  filter:drop-shadow(0 0 10px rgba(255,200,118,.62));
  animation:lanternFlame 1.3s ease-in-out infinite;
}
.lantern-bridge-lantern-tail{
  position:absolute;
  left:50%;
  bottom:4px;
  width:28px;
  height:12px;
  transform:translateX(-50%);
  border-top:1px solid rgba(188,129,80,.7);
  border-radius:50%;
}
.lantern-bridge-lantern-glow{
  position:absolute;
  inset:-18px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,197,118,.3), transparent 68%);
  filter:blur(10px);
  opacity:.8;
  animation:lanternGlow 2.6s ease-in-out infinite alternate;
}
@keyframes lanternGlow{
  0%{opacity:.42;transform:scale(.92);}
  100%{opacity:.96;transform:scale(1.06);}
}
@keyframes lanternFlame{
  0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg);}
  46%{transform:translateX(-50%) scale(1.08,.94) rotate(1deg);}
  76%{transform:translateX(-50%) scale(.94,1.08) rotate(-1deg);}
}
@keyframes lanternRise{
  0%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:blur(0);
  }
  18%{
    opacity:1;
    transform:translate(-50%,calc(-50% - 42px)) scale(1.03);
  }
  100%{
    opacity:0;
    transform:translate(-50%,calc(-50% - 62vh)) scale(.78);
    filter:blur(5px);
  }
}
/* 从屏幕上方慢慢下降到定位点 */
@keyframes lanternDescend{
  0%{
    opacity:0;
    transform:translate(-50%,calc(-50% - 72vh)) scale(.88);
    filter:blur(3px);
  }
  18%{
    opacity:.85;
    filter:blur(0);
  }
  78%{
    opacity:1;
    transform:translate(-50%,calc(-50% + 6px)) scale(1.02);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:blur(0);
  }
}
/* 到位后的轻微飘动 */
@keyframes lanternBob{
  0%,100%{ transform:translate(-50%, -50%) rotate(-1.2deg); }
  50%    { transform:translate(-50%, calc(-50% - 6px)) rotate(1.2deg); }
}
/* 从当前位置缓缓升空消失 */
@keyframes lanternRiseAway{
  0%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:blur(0);
  }
  24%{
    opacity:1;
    transform:translate(-50%,calc(-50% - 24vh)) scale(1.02);
  }
  100%{
    opacity:0;
    transform:translate(-50%,calc(-50% - 110vh)) scale(.72);
    filter:blur(6px);
  }
}

/* =====================================================
   终章信封（全部宝藏点亮后出现）
   ===================================================== */
#final-letter-layer{
  position:fixed;
  inset:0;
  z-index:640;
  pointer-events:none;
  opacity:0;
  transition:opacity 1.4s ease;
}
#final-letter-layer.active{
  opacity:1;
  pointer-events:auto;
}
#final-letter-layer::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center, rgba(6,4,18,.36) 0%, rgba(6,4,18,.72) 70%);
  backdrop-filter:blur(3px);
  transition:background 2.6s ease, backdrop-filter 2.6s ease;
}
/* 读信模式：整个世界"退场" —— 地图/星空/流星全部重度模糊+压暗 */
#final-letter-layer.reading::before{
  background:rgba(3,2,10,.92);
  backdrop-filter:blur(22px) saturate(.55) brightness(.6);
}
.final-letter-hint{
  position:absolute;
  top:calc(var(--map-top) + 30px);
  left:50%;
  transform:translateX(-50%);
  font-family:'Noto Serif SC',serif;
  font-size:clamp(13px,1.3vw,16px);
  letter-spacing:.3em;
  color:rgba(248,232,255,.78);
  text-shadow:0 0 16px rgba(220,180,255,.4);
  text-align:center;
  white-space:nowrap;
  opacity:0;
  filter:blur(0);
  transition:opacity .7s ease, transform .7s cubic-bezier(.2,.8,.24,1), filter .7s ease;
  animation:finalHintFade 2s ease forwards .6s;
}
@keyframes finalHintFade{
  to{opacity:1;}
}
.final-envelope{
  position:absolute;
  top:50%;
  left:50%;
  width:min(420px,80vw);
  height:min(260px,50vw);
  transform:translate(-50%,-50%);
  cursor:pointer;
  perspective:1200px;
  animation:envelopeFloat 4.8s ease-in-out infinite alternate;
  opacity:0;
  filter:blur(16px);
  transition:opacity 1.25s ease .32s, filter 1.25s ease .32s;
}
#final-letter-layer.active .final-envelope{
  opacity:1;
  filter:blur(0);
}
/* 信封打开后，信纸下方透出一圈暖色蜂蜜光晕，像烛光照在桌面上 */
.final-envelope::after{
  content:'';
  position:absolute;
  left:50%;
  top:50%;
  width:min(1100px,108vw);
  height:min(82vh,880px);
  transform:translate(-50%,-50%);
  background:
    radial-gradient(ellipse 52% 38% at 50% 72%, rgba(255,178,96,.34), rgba(255,140,70,.18) 38%, transparent 70%),
    radial-gradient(ellipse 40% 26% at 50% 98%, rgba(255,220,150,.26), transparent 62%),
    radial-gradient(ellipse 70% 50% at 50% 50%, rgba(255,200,130,.08), transparent 80%);
  filter:blur(42px);
  pointer-events:none;
  z-index:2;
  opacity:0;
  transition:opacity 2.2s ease;
}
.final-envelope.opened::after{
  opacity:1;
  transition-delay:.7s;
}
/* 收起流程：信纸先走基础 transition（.9s opacity + 1s transform，自然地缩回信封），
   然后让 flap/seal 延迟 .85s/.95s 再合上，形成"先装信、再合封"的先后感。
   这里不覆写 letter 的 transition 曲线 —— 用原来打开时同一条 cubic-bezier，反向播更自然。*/
.final-envelope.closing .final-envelope-flap{
  transition-delay:.85s !important;
}
.final-envelope.closing .final-envelope-seal{
  transition-delay:.95s !important;
}
.final-envelope.closing::after{
  /* 暖色光晕同步温柔撤走 */
  transition:opacity 1.4s ease !important;
  transition-delay:0s !important;
}
@keyframes envelopeFloat{
  0%{transform:translate(-50%,calc(-50% - 6px));}
  100%{transform:translate(-50%,calc(-50% + 6px));}
}
.final-envelope-glow{
  position:absolute;
  inset:-30%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,214,244,.3), rgba(188,124,255,.14) 55%, transparent 78%);
  filter:blur(24px);
  pointer-events:none;
  animation:envelopeGlowPulse 3.2s ease-in-out infinite alternate;
}
@keyframes envelopeGlowPulse{
  0%{opacity:.5;}
  100%{opacity:1;}
}
.final-envelope-body{
  position:absolute;
  inset:0;
  border-radius:10px;
  background:linear-gradient(135deg, #f3e6d2 0%, #e4c9a5 60%, #d4b184 100%);
  box-shadow:0 26px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(120,80,40,.3);
  overflow:hidden;
}
.final-envelope-body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg, transparent 0 49%, rgba(180,120,70,.25) 49.5% 50.5%, transparent 51% 100%),
    linear-gradient(225deg, transparent 0 49%, rgba(180,120,70,.25) 49.5% 50.5%, transparent 51% 100%);
  opacity:.85;
}
.final-envelope-flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:50%;
  background:linear-gradient(180deg, #e4c9a5 0%, #d4b184 100%);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:top center;
  transition:transform 1s cubic-bezier(.5,0,.2,1);
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  z-index:3;
}
.final-envelope.opened .final-envelope-flap{
  transform:rotateX(-178deg);
}
.final-envelope-seal{
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  width:60px;
  height:60px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #d24b68, #8a2340 70%);
  box-shadow:0 6px 14px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,190,200,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Noto Serif SC',serif;
  color:rgba(255,230,240,.92);
  font-size:22px;
  z-index:4;
  transition:transform .6s ease, opacity .6s ease;
}
.final-envelope.opened .final-envelope-seal{
  transform:translate(-50%,-50%) scale(.4);
  opacity:0;
}
.final-envelope-letter{
  position:absolute;
  top:50%;
  left:50%;
  width:min(820px,94vw);
  max-height:min(82vh,780px);
  transform:translate(-50%,-50%) scale(.3);
  background:
    linear-gradient(180deg, #fbf2e1, #f4e2c3);
  border-radius:6px;
  padding:14px;
  box-shadow:0 40px 80px rgba(0,0,0,.66), 0 0 0 1px rgba(170,120,70,.2);
  opacity:0;
  pointer-events:none;
  transition:opacity .9s ease, transform 1s cubic-bezier(.2,.8,.24,1);
  z-index:5;
  overflow-y:auto;
  overflow-x:hidden;
}
.final-envelope.opened .final-envelope-letter{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
  pointer-events:auto;
  transition-delay:.55s;
}
/* 虚线框挪到 sheet 上，会跟着正文高度一起伸长，不会再被截断 */
.final-letter-sheet{
  border:1px dashed rgba(150,100,60,.3);
  border-radius:4px;
  padding:clamp(24px,3.2vw,44px) clamp(26px,3.6vw,50px);
  min-height:100%;
}
.final-letter-title{
  font-family:'Noto Serif SC',serif;
  font-weight:400;
  font-size:clamp(18px,2.2vw,26px);
  color:#5d3718;
  letter-spacing:.18em;
  text-align:center;
  margin-bottom:16px;
  opacity:.88;
  /* 标题孤独展示期间居中：用 translateY 偏移，JS 加/移 .title-solo 触发 */
  transition:transform 1.8s cubic-bezier(.2,.82,.22,1);
}
/* 没有其他内容时，标题垂直居中在信封小矩形里（JS 动态测量后写入 --title-center-y） */
.final-letter-sheet.title-solo .final-letter-title{
  transform:translateY(var(--title-center-y, 40px));
}
.final-letter-body{
  font-family:'Noto Serif SC',serif;
  font-size:clamp(15px,1.6vw,18px);
  line-height:1.95;
  color:#3f2512;
  letter-spacing:.04em;
  font-style:italic;
}
.final-letter-body p{
  margin:0 0 .6em 0;
  text-indent:2em;
}
.final-letter-body p:empty{
  min-height:.8em;
}
/* 新：段落依次淡入（替代打字机）。每段 delay 由 JS 设置 */
/* 这里用接近线性的平缓曲线，让 opacity 在整条时间里均匀爬升，而不是在前 0.5s 冲到 85% 之后再硬拖剩下的时间 —— 那种看起来就是"啪一下出现"，不是 fade。*/
.final-letter-body p.fade-para{
  opacity:0;
  transform:translateY(18px);
  animation:finalLetterParaIn 2.6s cubic-bezier(.45,.08,.4,.95) both;
}
@keyframes finalLetterParaIn{
  0%  {opacity:0;  transform:translateY(18px) scale(.99); filter:blur(5px);}
  30% {opacity:.2;}
  60% {opacity:.55;}
  100%{opacity:1;  transform:translateY(0) scale(1); filter:blur(0);}
}
/* =========  终章爱心  ========= */
.final-letter-heart-wrap{
  display:flex;
  justify-content:center;
  margin:36px 0 8px;
  opacity:0;
  transition:opacity 1.6s ease, transform 1.6s ease;
  transform:translateY(6px);
}
.final-letter-heart-wrap.shown{
  opacity:1;
  transform:translateY(0);
}
.final-letter-heart-wrap.closing{
  opacity:0;
  transform:translateY(18px) scale(.96);
  pointer-events:none;
}
.final-letter-heart-wrap.closing .final-letter-heart{
  animation:none;
  transform:scale(.92);
}
.final-letter-heart-wrap.closing .final-letter-heart-caption{
  opacity:0;
  transition:opacity .28s ease;
}
.final-letter-heart{
  appearance:none;
  border:none;
  background:transparent;
  padding:10px;
  cursor:pointer;
  font-size:52px;
  line-height:1;
  color:#e8476f;
  filter:drop-shadow(0 0 22px rgba(255,120,160,.55)) drop-shadow(0 4px 14px rgba(0,0,0,.25));
  animation:finalHeartPulse 1.9s ease-in-out infinite;
  transition:transform .35s cubic-bezier(.2,.8,.24,1), filter .3s ease;
}
.final-letter-heart:hover{
  transform:scale(1.12);
  filter:drop-shadow(0 0 32px rgba(255,160,200,.85)) drop-shadow(0 6px 18px rgba(0,0,0,.3));
}
.final-letter-heart:focus-visible{
  outline:2px solid rgba(255,200,220,.7);
  outline-offset:6px;
  border-radius:50%;
}
@keyframes finalHeartPulse{
  0%,100%{ transform:scale(1);   filter:drop-shadow(0 0 20px rgba(232,71,111,.55)) drop-shadow(0 4px 12px rgba(0,0,0,.22)); }
  50%    { transform:scale(1.14);filter:drop-shadow(0 0 34px rgba(255,150,200,.9))  drop-shadow(0 6px 18px rgba(0,0,0,.28)); }
}
.final-letter-heart-caption{
  text-align:center;
  font-family:'Noto Serif SC',serif;
  font-size:clamp(11px,1.1vw,13px);
  color:rgba(120,80,40,.62);
  letter-spacing:.35em;
  margin-top:10px;
}

/* =========  终章动画：信纸升起 + 淡出  ========= */
.final-envelope.finale .final-envelope-letter{
  transform:translate(-50%,-62%) scale(1.02);
  opacity:0;
  transition:opacity 1.6s ease, transform 1.9s cubic-bezier(.2,.85,.24,1);
}
/* 信封背后的暖色光晕一起淡出 */
.final-envelope.finale::after{
  opacity:0;
  transition:opacity 1.4s ease;
}
/* 整个 layer 的黑色蒙层在终章里彻底让位 —— 之前 .reading::before 是 .92 全黑 + 22px blur
   把后面的星空 canvas 整片挡死了，看不到任何汇聚。这里直接按 !important 清零，并且
   0.5s 内完成，给星星一个干净的舞台。*/
#final-letter-layer.finale::before{
  background:rgba(2,1,6,0) !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  transition:background .6s ease, backdrop-filter .6s ease !important;
}

/* 触发终章时，把星空 canvas 从最底层（z:0）抬到 layer 之上（layer 是 640），
   彻底越过那层黑色蒙层，让汇聚/光晕/核心白爆直接盖在全屏最前面。!important 防止
   被 #star-canvas{z-index:0} 那一行后来居上盖掉。*/
body.stars-on-top #star-canvas{
  z-index:700 !important;
}

/* 终章的"舞台底色" —— 一层深紫色渐变让星光有得靠，但不黑得刺眼对比。
   注意这层在 z:600，位于 star-canvas(700) 之下、letter-layer(640) 之下，
   所以信纸淡出动画仍在它之上播放。*/
body.stars-on-top::after{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse at center, rgba(38,28,72,.42) 0%, rgba(18,12,40,.6) 70%, rgba(10,6,24,.7) 100%);
  z-index:600;
  pointer-events:none;
  animation:finaleStageIn 1.8s ease forwards;
}
@keyframes finaleStageIn{
  from{opacity:0;}
  to{opacity:1;}
}

/* 段落旁/下的照片条 */
.final-letter-photos{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin:2px 0 20px;
  opacity:0;
  transform:translateY(14px);
  animation:finalLetterParaIn 2.4s cubic-bezier(.45,.08,.4,.95) both;
}
.final-letter-photos img{
  height:clamp(110px,13vw,150px);
  width:auto;
  max-width:min(220px,40vw);
  object-fit:cover;
  cursor:zoom-in;
  border-radius:6px;
  border:1px solid rgba(150,100,60,.35);
  background:#f3e6d0;
  box-shadow:0 10px 26px rgba(60,30,10,.28), 0 0 0 4px rgba(251,242,225,.9);
  transition:transform .5s cubic-bezier(.2,.8,.24,1), box-shadow .4s ease;
}
.final-letter-photos img:focus-visible{
  outline:2px solid rgba(120,80,40,.5);
  outline-offset:6px;
}

function encodeTypewriterSource(text=''){
  return encodeURIComponent(String(text ?? ''));
}

function renderTypedText(text='', className='', options={}){
  const classes = ['text-typewriter'];
  if(className){
    classes.push(className);
  }
  const attrs = [
    `class="${classes.join(' ')}"`,
    `data-typewriter-source="${encodeTypewriterSource(text)}"`
  ];
  if(Number.isFinite(Number(options.delay))){
    attrs.push(`data-typewriter-delay="${Math.max(0, Number(options.delay))}"`);
  }
  if(options.manual){
    attrs.push('data-typewriter-manual="1"');
  }
  if(options.doneClosest){
    attrs.push(`data-typewriter-done-closest="${escapeHtml(String(options.doneClosest))}"`);
  }
  if(options.doneClass){
    attrs.push(`data-typewriter-done-class="${escapeHtml(String(options.doneClass))}"`);
  }
  return `<div ${attrs.join(' ')}></div>`;
}

function stopAllTextPlayers(){
  Array.from(ACTIVE_TEXT_PLAYERS).forEach(controller=>{
    if(controller && typeof controller.stop === 'function'){
      controller.stop();
    }
  });
  ACTIVE_TEXT_PLAYERS.clear();
}

function typeTextIntoElement(target, text='', options={}){
  if(!(target instanceof Element)) return null;
  if(target._typewriterController && typeof target._typewriterController.stop === 'function'){
    target._typewriterController.stop();
  }

  const lines = String(text ?? '').split('\n');
  const startDelay = Math.max(0, Number(options.delay) || 0);
  const minDelay = 28;
  const maxDelay = 64;
  const linePause = 420;
  let stopped = false;
  const timers = [];

  target.innerHTML = '';

  function queue(fn, delay){
    const id = window.setTimeout(()=>{
      if(stopped) return;
      fn();
    }, delay);
    timers.push(id);
  }

  function finish(){
    const doneClosest = options.doneClosest ? String(options.doneClosest) : '';
    const doneClass = options.doneClass ? String(options.doneClass) : 'done';
    if(doneClosest){
      const node = target.closest(doneClosest);
      if(node){
        node.classList.add(doneClass);
      }
    }
  }

  function typeLine(lineIndex){
    if(stopped) return;
    if(lineIndex >= lines.length){
      finish();
      return;
    }

    const row = document.createElement('p');
    target.appendChild(row);
    const line = String(lines[lineIndex] || '');
    let charIndex = 0;

    if(!line){
      row.innerHTML = '&nbsp;';
      queue(()=>typeLine(lineIndex + 1), linePause);
      return;
    }

    function typeChar(){
      if(stopped) return;
      if(charIndex >= line.length){
        queue(()=>typeLine(lineIndex + 1), linePause);
        return;
      }
      row.textContent += line.charAt(charIndex);
      charIndex += 1;
      queue(typeChar, minDelay + Math.random() * (maxDelay - minDelay));
    }

    typeChar();
  }

  const controller = {
    stop(){
      if(stopped) return;
      stopped = true;
      timers.forEach(clearTimeout);
      ACTIVE_TEXT_PLAYERS.delete(controller);
      if(target._typewriterController === controller){
        target._typewriterController = null;
      }
    }
  };

  target._typewriterController = controller;
  ACTIVE_TEXT_PLAYERS.add(controller);
  queue(()=>typeLine(0), startDelay);
  return controller;
}

function startTypedNode(node, overrides={}){
  if(!(node instanceof Element)) return null;
  let text = '';
  try{
    text = decodeURIComponent(node.getAttribute('data-typewriter-source') || '');
  }catch(_err){
    text = node.getAttribute('data-typewriter-source') || '';
  }
  const delay = Number.isFinite(Number(overrides.delay))
    ? Number(overrides.delay)
    : Number(node.getAttribute('data-typewriter-delay')) || 0;
  const doneClosest = overrides.doneClosest ?? node.getAttribute('data-typewriter-done-closest') ?? '';
  const doneClass = overrides.doneClass ?? node.getAttribute('data-typewriter-done-class') ?? '';
  return typeTextIntoElement(node, text, {delay, doneClosest, doneClass});
}

function startAutoTypewriters(root=document, includeManual=false){
  const nodes = [];
  if(root instanceof Element && root.matches('.text-typewriter[data-typewriter-source]')){
    nodes.push(root);
  }
  if(root && typeof root.querySelectorAll === 'function'){
    nodes.push(...root.querySelectorAll('.text-typewriter[data-typewriter-source]'));
  }
  nodes.forEach(node=>{
    const isManual = node.getAttribute('data-typewriter-manual') === '1';
    if(includeManual ? !isManual : isManual) return;
    startTypedNode(node);
  });
}

  const burst = document.createElement('div');
  burst.className = 'meteor-catch-burst';
  burst.style.left = `${x}px`;
  burst.style.top = `${y}px`;
  document.body.appendChild(burst);
  burst.addEventListener('animationend',()=>burst.remove(),{once:true});
}

function showMeteorWish(index){
  const wrap = document.getElementById('meteor-wish');
  const copy = document.getElementById('meteor-wish-copy');
  if(!wrap || !copy) return;
  const safeIndex = Number.isFinite(index) ? index : Math.floor(Math.random() * METEOR_WISHES.length);

}

function parseConfiguredDate(value){
  const raw = String(value || '').trim();
  if(!raw) return null;
  const parsed = new Date(raw);
  return Number.isNaN(parsed.getTime()) ? null : parsed;
}

function readStorageJson(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed == null ? fallback : parsed;
  }catch(_e){
    return fallback;
  }
}

function readStorageFlag(key){
  try{
    return localStorage.getItem(key) === '1';
  }catch(_e){
    return false;
  }
}

function writeStorageJson(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
  }catch(_e){}
}

function writeStorageFlag(key, value){
  try{
    localStorage.setItem(key, value ? '1' : '0');
  }catch(_e){}
}

  if(!Array.isArray(saved)) return;
  OPENED_TREASURE_IDS.clear();
  saved.forEach(id=>{
    if(TREASURE_BY_ID.has(id)){
      OPENED_TREASURE_IDS.add(id);
    }
  });
}

function rememberTreasureOpen(id){
  if(!id || OPENED_TREASURE_IDS.has(id)) return false;
  OPENED_TREASURE_IDS.add(id);
  persistOpenedTreasureProgress();
  return true;
}

function getBirthdayTriggerDate(){
  return parseConfiguredDate(BIRTHDAY_TRIGGER_AT) || new Date(2026, 3, 25, 0, 0, 0);
}

function getBirthdayTimingState(nowMs = Date.now()){
  const triggerAt = getBirthdayTriggerDate().getTime();
  const countdownStartAt = triggerAt - (BIRTHDAY_COUNTDOWN_SECONDS * 1000);
  const remainingMs = Math.max(0, triggerAt - nowMs);
  return {
    nowMs,
    triggerAt,
    countdownStartAt,
    beforeCountdown: nowMs < countdownStartAt,
    inCountdown: nowMs >= countdownStartAt && nowMs < triggerAt,
    triggered: nowMs >= triggerAt,
    remainingMs,
    remainingSeconds: Math.max(0, Math.ceil(remainingMs / 1000))
  };
}

function hasBirthdayTriggered(){
  return getBirthdayTimingState().triggered;
}

function hasFreeTreasureMode(){
  return hasBirthdayTriggered() && allTreasuresOpened();
}

function formatTriggerMoment(date){
  if(!(date instanceof Date) || Number.isNaN(date.getTime())) return '';
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  return `${month}/${day} ${hours}:${minutes}`;
}

function getSequenceIndex(id){
  const index = TREASURE_SEQUENCE.indexOf(id);
  return index === -1 ? null : index + 1;
}

// 返回当前序列中下一个未解锁的 id（生日前返回 null）
function getNextLockedSequenceId(){
  if(!hasBirthdayTriggered()) return null;
  for(const id of TREASURE_SEQUENCE){
    if(!OPENED_TREASURE_IDS.has(id)) return id;
  }
  return null; // 全部完成
}

function isTreasureAccessible(item){
  if(!item) return false;
  if(!hasBirthdayTriggered()) return false;
  if(hasFreeTreasureMode()) return true;
  if(OPENED_TREASURE_IDS.has(item.id)) return true; // 已解锁，允许回看
  return getNextLockedSequenceId() === item.id;       // 当前轮到这一站
}

function unlockTreasure(item){
  if(!item || OPENED_TREASURE_IDS.has(item.id)) return;
  if(!isTreasureAccessible(item)) return;
  rememberTreasureOpen(item.id);
}

function updateTreasureMarkerState(item){
  const marker = TREASURE_MARKERS.get(item.id);
  if(!marker) return;
  const button = marker.getElement()?.querySelector('.treasure-dot');
  if(!button) return;

  const birthdayReady = hasBirthdayTriggered();
  const freeMode = hasFreeTreasureMode();
  const opened = OPENED_TREASURE_IDS.has(item.id);
  const locked = !birthdayReady;
  const nextId = birthdayReady ? getNextLockedSequenceId() : null;
  const isCurrent = !opened && item.id === nextId && !freeMode;
  const order = getSequenceIndex(item.id);
  const labelPrefix = order ? `第 ${order} 站 · ` : '';

  const seqLocked = birthdayReady && !freeMode && !opened && !isCurrent;
  button.classList.toggle('locked', locked);
  button.classList.toggle('seq-locked', seqLocked);
  button.classList.toggle('current', isCurrent);
  button.classList.toggle('opened', freeMode || opened);
  button.setAttribute('aria-disabled', (locked || seqLocked) ? 'true' : 'false');

  let statusText = '等待解锁';
  if(!birthdayReady){
    statusText = `等待 ${formatTriggerMoment(getBirthdayTriggerDate())}`;
  }else if(freeMode){
    statusText = '全部开启，可自由回看';
  }else if(opened){
    statusText = '已解锁，可回看';
  }else if(isCurrent){
    statusText = '可打开';
  }else{
    statusText = '先解锁前面的站点';
  }
  const label = `${labelPrefix}${item.place} · ${statusText}`;
  button.setAttribute('aria-label', label);
  button.title = label;
}

function updateTreasureLockState(){
  TREASURES.forEach(item=>updateTreasureMarkerState(item));
}

// 生日前：显示"等待生日时刻"提示
function renderSequenceLockModal(item){
  const timing = getBirthdayTimingState();

  const countdownText = timing.inCountdown
    ? `生日倒数已经开始，还剩 ${timing.remainingSeconds} 秒。`
    : `会在 ${triggerLabel} 正式触发。`;

    <div class="modal-top">

}

function handleTreasureClick(item){

(function buildStarField(){
  const c = document.getElementById('star-canvas');
  const ctx = c.getContext('2d');
  const stars = [];
  let haze = null;
  const BUCKETS = 9;
  const buckets = Array.from({length:BUCKETS},()=>[]);

  function resize(){
    c.width = innerWidth;
    c.height = innerHeight;
    haze = ctx.createLinearGradient(0,0,c.width,c.height);
    haze.addColorStop(0,'rgba(88,66,148,.34)');
    haze.addColorStop(.5,'rgba(58,44,112,.24)');
    haze.addColorStop(1,'rgba(24,18,52,.38)');
    stars.length = 0;
    for(let i=0;i<280;i++){
      stars.push({
        x:Math.random()*c.width,
        y:Math.random()*c.height,
        r:Math.random()*1.35+.2,
        a:Math.random()*.75+.1,
        da:(Math.random()*.006)+.001
      });
    }
  }

  function draw(){
    // 生日开场黑屏盖住了整个视口，这一层完全看不见，
    // 省掉星星动画的算力留给倒数+蛋糕+烟花。
    if(window.BD_PAUSE_BACKGROUND){
      requestAnimationFrame(draw);
      return;
    }
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle = haze;
    ctx.fillRect(0,0,c.width,c.height);

    // 终章：信件爱心点击后，星星向视口中心汇聚并变亮
    const converging = window.STARS_CONVERGING;
    const cx = c.width * 0.5;
    const cy = c.height * 0.5;

    // 汇聚进度：从进入 converging 起的秒数
    let convergeT = 0;
    if(converging){
      if(!window.STARS_CONVERGE_T0) window.STARS_CONVERGE_T0 = performance.now();
      convergeT = (performance.now() - window.STARS_CONVERGE_T0) / 1000;
    }

    // 中央光晕 —— 极淡的薰衣草月晕，几乎像雾
    if(converging){
      const bloomR = Math.min(Math.max(c.width,c.height)*0.75, 140 + convergeT * 170);
      const bloomA = Math.min(0.18, 0.04 + convergeT * 0.06);
      const bg = ctx.createRadialGradient(cx,cy,0,cx,cy,bloomR);
      bg.addColorStop(0,   'rgba(235,220,248,'+bloomA.toFixed(3)+')');
      bg.addColorStop(0.35,'rgba(195,170,230,'+(bloomA*0.65).toFixed(3)+')');
      bg.addColorStop(0.7, 'rgba(130,110,190,'+(bloomA*0.3).toFixed(3)+')');
      bg.addColorStop(1,   'rgba(20,10,60,0)');
      ctx.fillStyle = bg;
      ctx.fillRect(0,0,c.width,c.height);
    }

    // 每帧 lerp 系数极其温柔：开始 0.012，3s 后 ~0.07 —— 仿佛星星自己选择靠过来
    const lerpK = converging ? Math.min(0.08, 0.012 + convergeT * 0.018) : 0;

    for(let b=0;b<BUCKETS;b++) buckets[b].length=0;
    for(const s of stars){
      s.a += s.da;
      if(s.a > .9 || s.a < .08) s.da *= -1;
      if(converging){
        // 极缓慢地向中心飘
        s.x += (cx - s.x) * lerpK;
        s.y += (cy - s.y) * lerpK;
        s.a = Math.min(0.85, s.a + 0.008);
        if(s.origR === undefined) s.origR = s.r;
        // 半径只温柔地长到原来的 1.8 倍
        s.r = Math.min(s.origR * 1.8, s.r + 0.012);
      }
      buckets[Math.min(BUCKETS-1, Math.floor(s.a*BUCKETS))].push(s);
    }

    ctx.fillStyle = '#f7ecff';
    for(let b=0;b<BUCKETS;b++){
      const group = buckets[b];
      if(!group.length) continue;
      ctx.globalAlpha = (b+0.5)/BUCKETS;
      ctx.beginPath();
      for(const s of group){
        ctx.moveTo(s.x+s.r,s.y);
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      }
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 汇聚后期：只在最中心透一点点暖香槟色的小月牙，像远处一盏灯
    // —— 不再画大半径白光，保持整体柔和
    if(converging && convergeT > 1.8){
      const cT = convergeT - 1.8;
      const coreR = Math.min(c.height*0.10, cT * 28);
      const coreA = Math.min(0.20, cT * 0.08);
      const cg = ctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
      cg.addColorStop(0,  'rgba(255,240,220,'+coreA.toFixed(3)+')');
      cg.addColorStop(0.6,'rgba(240,215,235,'+(coreA*0.4).toFixed(3)+')');
      cg.addColorStop(1,  'rgba(200,180,230,0)');
      ctx.fillStyle = cg;
      ctx.fillRect(0,0,c.width,c.height);
    }
    requestAnimationFrame(draw);
  }

  // 暴露一个复位函数：终章结束时把星星打回随机位置、半径，
  // 让关闭信件回到地图时不会是一团亮点堆在屏幕中央。
  window.__resetStars = function(){
    window.STARS_CONVERGING = false;
    window.STARS_CONVERGE_T0 = null;
    for(const s of stars){
      s.x = Math.random() * c.width;
      s.y = Math.random() * c.height;
      if(s.origR !== undefined){ s.r = s.origR; s.origR = undefined; }
      s.a = Math.random()*.75 + .1;
    }
  };

  resize();
  addEventListener('resize',resize);
  draw();
})();

(function startMeteorFlow(){
  const layer = document.getElementById('meteors-layer');
  if(!layer) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let active = 0;
  const maxActive = 3;

  function removeMeteor(meteor){
    if(!meteor || meteor.dataset.gone === '1') return;
    meteor.dataset.gone = '1';
    meteor.remove();
    active = Math.max(0, active - 1);
  }

  function schedule(){
    const wait = 2400 + Math.random()*3200;
    setTimeout(spawn, wait);
  }

  function spawn(){
    if(active >= maxActive){schedule(); return;}
    const meteor = document.createElement('div');
    meteor.className = 'meteor-streak catchable';

    const sx = -24 + Math.random()*56;
    const sy = 4 + Math.random()*54;
    const ex = sx + 120 + Math.random()*34;
    const ey = sy + 28 + Math.random()*26;
    const angle = 18 + Math.random()*10;
    const len = 170 + Math.random()*240;
    const thick = 1.1 + Math.random()*1.6;
    const dur = 3000 + Math.random()*2600;
    const op = .68 + Math.random()*.22;

    meteor.style.setProperty('--sx', `${sx}vw`);
    meteor.style.setProperty('--sy', `${sy}vh`);
    meteor.style.setProperty('--ex', `${ex}vw`);
    meteor.style.setProperty('--ey', `${ey}vh`);
    meteor.style.setProperty('--ang', `${angle}deg`);
    meteor.style.setProperty('--len', `${len}px`);
    meteor.style.setProperty('--thick', `${thick}px`);
    meteor.style.setProperty('--dur', `${dur}ms`);
    meteor.style.setProperty('--op', `${op}`);
    meteor.dataset.wishIndex = String(Math.floor(Math.random() * METEOR_WISHES.length));
    meteor.setAttribute('title', '抓住流星，替甜甜许个愿');

    active += 1;
    layer.appendChild(meteor);
    meteor.addEventListener('pointerdown',event=>{
      event.preventDefault();
      event.stopPropagation();
      // 有弹窗打开时忽略流星点击，避免意外跳转
      if(isAnyOverlayOpen()) return;
      const x = typeof event.clientX === 'number' ? event.clientX : innerWidth * 0.5;
      const y = typeof event.clientY === 'number' ? event.clientY : innerHeight * 0.35;
      spawnMeteorCatchBurst(x, y);
      showMeteorWish(Number(meteor.dataset.wishIndex));
      removeMeteor(meteor);
    });
    meteor.addEventListener('animationend',()=>{
      removeMeteor(meteor);
    },{once:true});

    schedule();
  }

  setTimeout(schedule, 1200);
})();

function shouldTriggerShijiazhuangLanternBridge(item){
  if(!item || item.id !== 'shijiazhuang') return false;
  if(hasFreeTreasureMode()) return false;

  if(!OPENED_TREASURE_IDS.has('new-brunswick')) return false; // NB 必须先访问才触发灯笼

}

function getLanternBridgePositions(total=5){
  // 屏幕底部横向分布，每盏灯自然悬停的目标点
  const positions = [];
  const span = 72;          // x 范围（百分比）
  const start = (100 - span) / 2;  // 居中
  for(let i = 0; i < total; i++){
    const t = total === 1 ? 0.5 : i / (total - 1);
    const x = start + span * t + (Math.random() * 5 - 2.5);
    // 底部 68%～84%，每盏灯错落一点
    const y = 72 + ((i % 2 === 0) ? 0 : 8) + (Math.random() * 6 - 3);
    positions.push({
      x: Math.max(8, Math.min(92, x)),
      y: Math.max(62, Math.min(88, y))
    });
  }
  return positions;
}

function launchShijiazhuangWithWelcome(){
  const item = TREASURE_BY_ID.get('shijiazhuang');
  if(!item) return;
  unlockTreasure(item);

      const fire = document.getElementById(`jig-fire-${item.id}`);
      if(fire){
        playJigsawFireworks(fire, {
          durationMs:Number(item.welcomeFireworksMs) || 3200
        });
      }
    }, 140);
  }
}

function startShijiazhuangLanternBridge(){
  if(SHIJIAZHUANG_LANTERN_STATE.active) return;
  const item = TREASURE_BY_ID.get('shijiazhuang');
  if(!shouldTriggerShijiazhuangLanternBridge(item)) return;

  const layer = document.getElementById('lantern-bridge');
  const stage = document.getElementById('lantern-bridge-stage');
  if(!layer || !stage) return;

  cleanupShijiazhuangLanternBridge();
  SHIJIAZHUANG_LANTERN_STATE.active = true;
  layer.setAttribute('aria-hidden','false');
  layer.classList.add('active');

  const positions = getLanternBridgePositions(5);
  const timers = [];

  // 时序：每盏灯错开 0.62s 出现 —— 下落 5.6s —— 悬停 2.6~3.8s —— 升空 5.2s
  const descendDurationMs = 5600;
  const stagger = 620;
  const riseAwayMs = 5200; // 与 CSS lanternRiseAway 动画时长一致

  let completed = 0;
  const total = positions.length;

  // 释放一盏灯：加 .released + 从此刻开始计 vanish 倒计时
  function releaseLantern(lantern){
    if(lantern.classList.contains('released')) return;
    lantern.classList.add('released');
    const t = window.setTimeout(()=>{
      completed += 1;
      if(completed >= total){
        cleanupShijiazhuangLanternBridge();
        launchShijiazhuangWithWelcome();
      }
    }, riseAwayMs);
    timers.push(t);
  }

  positions.forEach((position, index)=>{
    const lantern = document.createElement('div');
    lantern.className = 'lantern-bridge-lantern';
    lantern.setAttribute('aria-hidden','true');
    const startDelaySec = (index * stagger) / 1000;
    const lingerMs = 2600 + Math.random() * 1300;
    lantern.style.setProperty('--land-left', `${position.x}%`);
    lantern.style.setProperty('--land-top', `${position.y}%`);
    lantern.style.setProperty('--descend-delay', `${startDelaySec}s`);
    lantern.style.setProperty('--descend-duration', `${descendDurationMs/1000}s`);
    lantern.innerHTML = `
      <span class="lantern-bridge-lantern-glow"></span>
      <span class="lantern-bridge-lantern-shell">
        <span class="lantern-bridge-lantern-core"></span>
        <span class="lantern-bridge-lantern-flame"></span>
      </span>
      <span class="lantern-bridge-lantern-tail"></span>
    `;
    stage.appendChild(lantern);

    // 下落结束后，加上 .landed（启动悬停漂动 + 启用点击）
    lantern.addEventListener('animationend', function onDescendEnd(e){
      if(e.animationName === 'lanternDescend'){
        lantern.classList.add('landed');
        lantern.removeEventListener('animationend', onDescendEnd);
      }
    });

    // 自动释放：下落 + linger 后自动升空
    const autoReleaseMs = index * stagger + descendDurationMs + lingerMs;
    const autoTimer = window.setTimeout(()=>releaseLantern(lantern), autoReleaseMs);
    timers.push(autoTimer);

    // 点击 / 触摸放飞（.landed 后才可交互，CSS 已设 pointer-events:auto）
    lantern.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      releaseLantern(lantern);
    });
  });

  SHIJIAZHUANG_LANTERN_STATE.cleanup = ()=>{
    timers.forEach(t=>clearTimeout(t));
  };
}
