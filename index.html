function clearAudioFade(audio){
  if(audio && audio._fadeTimer){
    clearInterval(audio._fadeTimer);
    audio._fadeTimer = null;
  }
}

function isHomePlaylistTrigger(src=''){
  const raw = String(src || '').trim();
  if(!raw) return false;
  if(HOME_MUSIC_REQUEST_TOKENS.has(raw)) return true;
  const safeSrc = safeMediaSrc(raw);
  return HOME_MUSIC_PLAYLIST.some(track=>safeMediaSrc(track) === safeSrc);
}

function getHomePlaylistSrc(index=0){
  const total = HOME_MUSIC_PLAYLIST.length || 1;
  const normalized = ((Number(index) || 0) % total + total) % total;
  return safeMediaSrc(HOME_MUSIC_PLAYLIST[normalized] || HOME_MUSIC_PLAYLIST[0] || '');
}

function ensureHomeDeck(index){
  if(!BACKGROUND_MUSIC_STATE.decks[index]){
    const audio = new Audio();
    audio.preload = 'auto';
    audio.loop = false;
    BACKGROUND_MUSIC_STATE.decks[index] = audio;
  }
  return BACKGROUND_MUSIC_STATE.decks[index];
}

function clearHomeAudioListeners(audio){
  if(!audio) return;
  if(audio._homeTimeUpdate){
    audio.removeEventListener('timeupdate', audio._homeTimeUpdate);
    audio._homeTimeUpdate = null;
  }
  if(audio._homeEnded){
    audio.removeEventListener('ended', audio._homeEnded);
    audio._homeEnded = null;
  }
}

function getActiveHomeAudio(){
  return BACKGROUND_MUSIC_STATE.decks[BACKGROUND_MUSIC_STATE.activeDeck] || null;
}

function getDominantHomeAudio(){
  const [first, second] = BACKGROUND_MUSIC_STATE.decks;
  if(first && !first.paused && (!second || second.paused || first.volume >= second.volume)){
    return first;
  }
  if(second && !second.paused){
    return second;
  }
  return getActiveHomeAudio();
}

function bindHomePlaylistRetry(index=0, startTime=0){
  if(BACKGROUND_MUSIC_STATE.retryBound) return;
  const retry = ()=>{
    window.removeEventListener('click', retry, true);
    window.removeEventListener('touchstart', retry, true);
    window.removeEventListener('keydown', retry, true);
    BACKGROUND_MUSIC_STATE.retryBound = false;
    startHomePlaylistAt(index, startTime);
  };
  BACKGROUND_MUSIC_STATE.retryBound = true;
  window.addEventListener('click', retry, true);
  window.addEventListener('touchstart', retry, true);
  window.addEventListener('keydown', retry, true);
}

function bindHomeAudioLifecycle(audio, index){
  clearHomeAudioListeners(audio);
  const total = HOME_MUSIC_PLAYLIST.length || 1;
  const normalized = ((Number(index) || 0) % total + total) % total;

  const onTimeUpdate = ()=>{
    if(BACKGROUND_MUSIC_STATE.suspendedByLetter || BACKGROUND_MUSIC_STATE.pendingCrossfade) return;
    if(audio !== getActiveHomeAudio()) return;
    if(!Number.isFinite(audio.duration) || audio.duration <= 0) return;
    BACKGROUND_MUSIC_STATE.resumeIndex = normalized;
    BACKGROUND_MUSIC_STATE.resumeTime = Math.max(0, audio.currentTime || 0);
    const remaining = audio.duration - audio.currentTime;
    if(remaining <= HOME_MUSIC_CROSSFADE_MS / 1000 + 0.08){
      startHomeCrossfade(normalized + 1);
    }
  };

  const onEnded = ()=>{
    if(BACKGROUND_MUSIC_STATE.suspendedByLetter || BACKGROUND_MUSIC_STATE.pendingCrossfade) return;
    if(audio !== getActiveHomeAudio()) return;
    startHomePlaylistAt(normalized + 1, 0);
  };

  audio._homeTimeUpdate = onTimeUpdate;
  audio._homeEnded = onEnded;
  audio.addEventListener('timeupdate', onTimeUpdate);
  audio.addEventListener('ended', onEnded);
}

async function startHomePlaylistAt(index=0, startTime=0){
  const total = HOME_MUSIC_PLAYLIST.length;
  if(!total) return false;

  const normalized = ((Number(index) || 0) % total + total) % total;
  const safeTime = Math.max(0, Number(startTime) || 0);

  BACKGROUND_MUSIC_STATE.requested = true;
  BACKGROUND_MUSIC_STATE.suspendedByLetter = false;
  BACKGROUND_MUSIC_STATE.pendingCrossfade = false;

  if(FINAL_LETTER_AUDIO_STATE.active){
    BACKGROUND_MUSIC_STATE.resumeIndex = normalized;
    BACKGROUND_MUSIC_STATE.resumeTime = safeTime;
    return true;
  }

  const activeAudio = ensureHomeDeck(BACKGROUND_MUSIC_STATE.activeDeck);
  const standbyAudio = ensureHomeDeck(1 - BACKGROUND_MUSIC_STATE.activeDeck);
  clearHomeAudioListeners(activeAudio);
  clearHomeAudioListeners(standbyAudio);
  clearAudioFade(activeAudio);
  clearAudioFade(standbyAudio);
  try{
    standbyAudio.pause();
    standbyAudio.currentTime = 0;
  }catch(_e){}

  try{
    activeAudio.pause();
    activeAudio.src = getHomePlaylistSrc(normalized);
    activeAudio.preload = 'auto';
    activeAudio.loop = false;
    activeAudio.load();
    if(safeTime > 0){
      const applyTime = ()=>{
        try{
          const duration = Number.isFinite(activeAudio.duration) ? activeAudio.duration : 0;
          activeAudio.currentTime = duration > 0
            ? Math.min(safeTime, Math.max(0, duration - 0.35))
            : safeTime;
        }catch(_e){}
      };
      if(activeAudio.readyState >= 1){
        applyTime();
      }else{
        activeAudio.addEventListener('loadedmetadata', applyTime, {once:true});
      }
    }
    activeAudio.volume = 0;
    bindHomeAudioLifecycle(activeAudio, normalized);
    const attempt = activeAudio.play();
    if(attempt && typeof attempt.catch === 'function'){
      await attempt;
    }
    fadeAudioIn(activeAudio, HOME_MUSIC_VOLUME, HOME_MUSIC_CROSSFADE_MS);
    BACKGROUND_MUSIC_STATE.audio = activeAudio;
    BACKGROUND_MUSIC_STATE.src = activeAudio.src;
    BACKGROUND_MUSIC_STATE.currentIndex = normalized;
    BACKGROUND_MUSIC_STATE.resumeIndex = normalized;
    BACKGROUND_MUSIC_STATE.resumeTime = safeTime;
    BACKGROUND_MUSIC_STATE.started = true;
    return true;
  }catch(_err){
    bindHomePlaylistRetry(normalized, safeTime);
    return false;
  }
}

// 生日后刷新页面：点开任意地点时冷启动随机播放
function maybeColdStartHomeMusic(){
  if(!hasBirthdayTriggered()) return;
  if(BACKGROUND_MUSIC_STATE.requested) return; // 已经启动过，跳过
  if(FINAL_LETTER_AUDIO_STATE.active) return;
  const total = HOME_MUSIC_PLAYLIST.length;
  if(!total) return;
  const randomIdx = Math.floor(Math.random() * total);
  startHomePlaylistAt(randomIdx, 0);
}

function releaseBirthdayIntroAudioForPlaylist(fadeMs=HOME_MUSIC_CROSSFADE_MS){
  const audio = BIRTHDAY_INTRO_STATE.audio;
  if(!audio) return false;

  if(audio._homeHandoffListener){
    audio.removeEventListener('ended', audio._homeHandoffListener);
    audio._homeHandoffListener = null;
  }

  BIRTHDAY_INTRO_STATE.audio = null;
  clearAudioFade(audio);

  const safeFadeMs = Math.max(180, Number(fadeMs) || 0);
  if(!audio.paused && !audio.ended){
    fadeAudioOut(audio, safeFadeMs);
    window.setTimeout(()=>{
      clearAudioFade(audio);
      try{
        audio.pause();
        audio.currentTime = 0;
      }catch(_e){}
    }, safeFadeMs + 120);
  }else{
    try{
      audio.pause();
      audio.currentTime = 0;
    }catch(_e){}
  }

  return true;
}

// 打开波多黎各时：用标准交叉淡入切到 First Love，并让后续继续正常轮播
function triggerPuertoRicoMusicFade(){
  if(!hasBirthdayTriggered()) return;
  const firstLoveSrc = safeMediaSrc('./First Love.mp3');
  const firstLoveIdx = HOME_MUSIC_PLAYLIST.findIndex(
    t => safeMediaSrc(t) === firstLoveSrc
  );
  if(firstLoveIdx === -1) return;

  const birthdayIntroPlaying = !!(
    BIRTHDAY_INTRO_STATE.audio &&
    !BIRTHDAY_INTRO_STATE.audio.paused &&
    !BIRTHDAY_INTRO_STATE.audio.ended
  );

  // 冷启动：音乐还没开始，直接从 First Love 起播
  if(!BACKGROUND_MUSIC_STATE.requested){
    if(birthdayIntroPlaying){
      releaseBirthdayIntroAudioForPlaylist(HOME_MUSIC_CROSSFADE_MS);
    }
    startHomePlaylistAt(firstLoveIdx, 0);
    return;
  }

  // 已经在播 First Love，不重复
  if(BACKGROUND_MUSIC_STATE.currentIndex === firstLoveIdx){
    const activeAudio = getActiveHomeAudio();
    if(activeAudio && activeAudio.paused){
      startHomePlaylistAt(firstLoveIdx, 0);
    }
    return;
  }

  if(birthdayIntroPlaying){
    releaseBirthdayIntroAudioForPlaylist(HOME_MUSIC_CROSSFADE_MS);
    startHomePlaylistAt(firstLoveIdx, 0);
    return;
  }

  const dominantHomeAudio = getDominantHomeAudio();
  if(!dominantHomeAudio || dominantHomeAudio.paused){
    startHomePlaylistAt(firstLoveIdx, 0);
    return;
  }

  const handoffToPuertoRicoTrack = ()=>{
    if(FINAL_LETTER_AUDIO_STATE.active) return;
    if(BACKGROUND_MUSIC_STATE.pendingCrossfade){
      window.setTimeout(handoffToPuertoRicoTrack, 220);
      return;
    }
    BACKGROUND_MUSIC_STATE.suspendedByLetter = false;
    startHomeCrossfade(firstLoveIdx);
  };

  handoffToPuertoRicoTrack();
}

async function startHomeCrossfade(index=0){
  if(BACKGROUND_MUSIC_STATE.pendingCrossfade || BACKGROUND_MUSIC_STATE.suspendedByLetter || FINAL_LETTER_AUDIO_STATE.active){
    return false;
  }

  const total = HOME_MUSIC_PLAYLIST.length;
  if(!total) return false;
  const normalized = ((Number(index) || 0) % total + total) % total;

  const fromDeck = BACKGROUND_MUSIC_STATE.activeDeck;
  const toDeck = 1 - fromDeck;
  const currentAudio = ensureHomeDeck(fromDeck);
  const nextAudio = ensureHomeDeck(toDeck);

  BACKGROUND_MUSIC_STATE.pendingCrossfade = true;
  clearHomeAudioListeners(nextAudio);
  clearAudioFade(nextAudio);

  try{
    nextAudio.pause();
    nextAudio.src = getHomePlaylistSrc(normalized);
    nextAudio.preload = 'auto';
    nextAudio.loop = false;
    nextAudio.currentTime = 0;
    nextAudio.load();
    nextAudio.volume = 0;
    bindHomeAudioLifecycle(nextAudio, normalized);
    const attempt = nextAudio.play();
    if(attempt && typeof attempt.catch === 'function'){
      await attempt;
    }
  }catch(_err){
    BACKGROUND_MUSIC_STATE.pendingCrossfade = false;
    bindHomePlaylistRetry(normalized, 0);
    return false;
  }

  BACKGROUND_MUSIC_STATE.activeDeck = toDeck;
  BACKGROUND_MUSIC_STATE.audio = nextAudio;
  BACKGROUND_MUSIC_STATE.src = nextAudio.src;
  BACKGROUND_MUSIC_STATE.currentIndex = normalized;
  BACKGROUND_MUSIC_STATE.resumeIndex = normalized;
  BACKGROUND_MUSIC_STATE.resumeTime = 0;

  fadeAudioIn(nextAudio, HOME_MUSIC_VOLUME, HOME_MUSIC_CROSSFADE_MS);
  fadeAudioOut(currentAudio, HOME_MUSIC_CROSSFADE_MS);

  window.setTimeout(()=>{
    clearHomeAudioListeners(currentAudio);
    BACKGROUND_MUSIC_STATE.pendingCrossfade = false;
  }, HOME_MUSIC_CROSSFADE_MS + 180);
  return true;
}

function pauseHomePlaylistForEnvelope(){
  BACKGROUND_MUSIC_STATE.requested = true;
  BACKGROUND_MUSIC_STATE.suspendedByLetter = true;
  BACKGROUND_MUSIC_STATE.pendingCrossfade = false;

  const dominant = getDominantHomeAudio();
  if(dominant && !dominant.paused){
    BACKGROUND_MUSIC_STATE.resumeIndex = BACKGROUND_MUSIC_STATE.currentIndex;
    BACKGROUND_MUSIC_STATE.resumeTime = Math.max(0, dominant.currentTime || 0);
  }

  BACKGROUND_MUSIC_STATE.decks.forEach(audio=>{
    if(!audio) return;
    clearHomeAudioListeners(audio);
    clearAudioFade(audio);
    if(!audio.paused){
      fadeAudioOut(audio, 2400);
    }
  });
}

function resumeHomePlaylistAfterEnvelope(){
  if(!BACKGROUND_MUSIC_STATE.requested) return;
  BACKGROUND_MUSIC_STATE.suspendedByLetter = false;
  const index = Number.isFinite(BACKGROUND_MUSIC_STATE.resumeIndex)
    ? BACKGROUND_MUSIC_STATE.resumeIndex
    : (BACKGROUND_MUSIC_STATE.started ? BACKGROUND_MUSIC_STATE.currentIndex : 0);
  const startTime = BACKGROUND_MUSIC_STATE.started
    ? Math.max(0, Number(BACKGROUND_MUSIC_STATE.resumeTime) || 0)
    : 0;
  startHomePlaylistAt(index, startTime);
}

async function tryPlayPersistentBackgroundMusic(src=''){
  const raw = String(src || '').trim();
  if(!raw) return false;
  if(!isHomePlaylistTrigger(raw)) return false;

  BACKGROUND_MUSIC_STATE.requested = true;

  if(FINAL_LETTER_AUDIO_STATE.active){
    return true;
  }

  if(BIRTHDAY_INTRO_STATE.audio && !BIRTHDAY_INTRO_STATE.audio.paused && !BIRTHDAY_INTRO_STATE.audio.ended){
    BACKGROUND_MUSIC_STATE.started = true;
    BACKGROUND_MUSIC_STATE.currentIndex = 0;
    BACKGROUND_MUSIC_STATE.resumeIndex = 1;
    BACKGROUND_MUSIC_STATE.resumeTime = 0;
    return true;
  }

  const activeAudio = getActiveHomeAudio();
  if(activeAudio && !activeAudio.paused){
    return true;
  }

  const index = BACKGROUND_MUSIC_STATE.started
    ? BACKGROUND_MUSIC_STATE.resumeIndex
    : 0;
  const startTime = BACKGROUND_MUSIC_STATE.started
    ? BACKGROUND_MUSIC_STATE.resumeTime
    : 0;
  return startHomePlaylistAt(index, startTime);
}

function isPersistentBackgroundMusicPlaying(src=''){
  if(!isHomePlaylistTrigger(src)) return false;
  if(FINAL_LETTER_AUDIO_STATE.active) return false;
  if(BIRTHDAY_INTRO_STATE.audio && !BIRTHDAY_INTRO_STATE.audio.paused && !BIRTHDAY_INTRO_STATE.audio.ended){
    return true;
  }
  const activeAudio = getActiveHomeAudio();
  return !!activeAudio && !activeAudio.paused;
}

          <button onclick="checkCode('${item.answer}','${inputId}','${resultId}','${escapeJs(item.reward)}')">解锁</button>
        </div>
        <div class="game-result" id="${resultId}"></div>
        ${revealHtml}
      </div>
    `;
  }

  if(item.type === 'typewriter'){
    const wrapId = `typewriter-${item.id}`;
    const mediaHtml = renderTypewriterMedia(item);
    const outputText = Array.isArray(item.lines) && item.lines.length
      ? item.lines.join('\n')

    body = `
      <div class="typewriter-wrap" id="${wrapId}">
        <div class="typewriter-stage">

          <span class="typewriter-caret">▋</span>
          ${mediaHtml}
        </div>
      </div>
    `;
  }

  if(item.type === 'candle'){
    const wrapId = `wish-${item.id}`;
    const startId = `wish-start-${item.id}`;
    const statusId = `wish-status-${item.id}`;
    const meterId = `wish-meter-${item.id}`;
    body = `
      <div class="wish-wrap" id="${wrapId}">
        ${renderTypedText(item.text || '', 'wish-hint')}
        <div class="wish-controls">
          <button class="wish-start" id="${startId}" type="button">开始许愿并吹气</button>
          <span class="wish-status" id="${statusId}">等待授权麦克风</span>
        </div>
        <div class="wish-meter"><span class="wish-meter-fill" id="${meterId}"></span></div>
        <div class="wish-scene">
          <div class="wish-candle">
            <span class="wish-flame"></span>
            <span class="wish-wick"></span>
            <span class="wish-candle-body"></span>
            <span class="wish-candle-shine"></span>
          </div>
          <div class="wish-dim"></div>
          <div class="wish-reveal">${renderWishReveal(item)}</div>
        </div>
      </div>
    `;
  }

  if(item.type === 'jigsaw'){
    const gridSize = Math.max(2, Math.min(5, Number(item.grid) || 3));
    const total = gridSize * gridSize;
    const wrapId = `jig-wrap-${item.id}`;
    const gridId = `jig-grid-${item.id}`;
    const trayId = `jig-tray-${item.id}`;
    const trayTopId = `jig-tray-top-${item.id}`;
    const trayRightId = `jig-tray-right-${item.id}`;
    const trayLeftId = `jig-tray-left-${item.id}`;
    const statusId = `jig-status-${item.id}`;
    const fireId = `jig-fire-${item.id}`;
    const revealHtml = renderJigsawReveal(item);
    const useAroundTray = item.trayLayout === 'around';
    body = `
      <div class="jigsaw-wrap${useAroundTray ? ' tray-around' : ''}" id="${wrapId}">
        ${renderTypedText(item.text || '', 'jigsaw-hint')}
        <div class="jigsaw-board">
          ${useAroundTray ? `<div class="jigsaw-tray jigsaw-tray-top" id="${trayTopId}"></div>` : ''}
          ${useAroundTray ? `<div class="jigsaw-tray jigsaw-tray-left" id="${trayLeftId}"></div>` : ''}
          <div class="jigsaw-stage" style="${buildJigsawStageStyle(item)}">
            <div class="jigsaw-photo" style="${buildJigsawPhotoStyle(item)}"></div>
            <div class="jigsaw-grid" id="${gridId}" style="grid-template-columns:repeat(${gridSize},1fr);grid-template-rows:repeat(${gridSize},1fr);"></div>
          </div>
          ${useAroundTray
            ? `<div class="jigsaw-tray jigsaw-tray-right" id="${trayRightId}"></div>`
            : `<div class="jigsaw-tray jigsaw-tray-side" id="${trayId}"></div>`
          }
          <canvas class="jigsaw-fireworks" id="${fireId}"></canvas>
        </div>
        <div class="jigsaw-status" id="${statusId}">已拼好 0 / ${total} 块</div>
        ${revealHtml ? `<div class="jigsaw-reveal">${revealHtml}</div>` : ''}
      </div>
    `;
  }

  if(item.type === 'match'){
    const wrapId = `memory-match-${item.id}`;
    const gridId = `mm-grid-${item.id}`;
    const galleryId = `mm-complete-${item.id}`;
    body = `
      <div class="memory-match" id="${wrapId}">
        <div class="memory-grid" id="${gridId}"></div>
        <div class="mm-complete-grid" id="${galleryId}"></div>
      </div>
    `;
  }

  return `
    <div class="modal-top">
      <div>
        <div class="modal-title">${escapeHtml(item.title)}</div>
        <div class="modal-sub">${escapeHtml(item.place)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">关闭</button>
    </div>
    <div class="modal-body">${body}</div>
  `;
}

function safeMediaSrc(src=''){
  const raw = String(src).trim();
  if(!raw) return '';
  try{
    return encodeURI(decodeURI(raw));
  }catch{
    return encodeURI(raw);
  }
}

function buildZoomableImage(src, alt='image'){
  const safeSrc = safeMediaSrc(src);
  return `<img class="zoomable-image" src="${escapeHtml(safeSrc)}" alt="${escapeHtml(alt)}" data-lightbox-src="${escapeHtml(safeSrc)}" data-lightbox-alt="${escapeHtml(alt)}">`;
}

function renderInlineMediaContent(item, labelPrefix='memory'){
  const video = typeof item.video === 'string' ? item.video.trim() : '';
  const poster = typeof item.videoPoster === 'string' ? item.videoPoster.trim() : '';
  const gallery = Array.isArray(item.gallery) ? item.gallery.filter(Boolean) : [];
  const autoplay = !!item.videoAutoplay;
  const shouldLoop = item.videoLoop !== false;
  const attrs = [
    'controls',
    'muted',
    'playsinline',
    'preload="metadata"'
  ];
  if(shouldLoop){
    attrs.push('loop');
  }
  if(autoplay){
    attrs.push('autoplay');
    attrs.push('data-autoplay-on-visible="1"');
  }
  const videoHtml = video
    ? `<div class="inline-media-video"><video ${attrs.join(' ')} ${poster ? `poster="${escapeHtml(safeMediaSrc(poster))}"` : ''} src="${escapeHtml(safeMediaSrc(video))}"></video></div>`
    : '';
  const galleryHtml = gallery.length
    ? `<div class="inline-media-grid">${gallery.map((src,index)=>buildZoomableImage(src, `${labelPrefix} ${index + 1}`)).join('')}</div>`
    : '';
  return `${videoHtml}${galleryHtml}`;
}

function renderGameReveal(item){
  const mediaHtml = renderInlineMediaContent(item, item.place || 'memory');
  return mediaHtml ? `<div class="game-reveal">${mediaHtml}</div>` : '';

function initConstellation(item){
  if(!item) return;
  const wrap = document.getElementById(`constellation-${item.id}`);
  const status = document.getElementById(`constellation-status-${item.id}`);
  if(!wrap) return;

  const stars = Array.from(wrap.querySelectorAll('.constellation-star'));
  const lines = Array.from(wrap.querySelectorAll('.constellation-line'));
  if(!stars.length) return;

  // 本次会话内已连线完成 → 直接还原完成态
  if(CONSTELLATION_SOLVED_IDS.has(item.id)){
    wrap.classList.add('solved');
    stars.forEach(s => s.classList.add('connected'));
    lines.forEach(l => l.classList.add('active'));
    if(status) status.textContent = `${item.constellationName || '星座'} 已经亮起来了，我们在新加坡的回忆出现了。`;
    startAutoTypewriters(wrap, true);
    INTERACTIVE_STATE.constellation = { stop(){} };
    return;
  }

  let currentIndex = -1;
  let solved = false;
  let wrongTimer = 0;
  const listeners = [];

  function setStatus(text){
    if(!status) return;
    status.textContent = text;
  }

  function getStarTag(index){
    const star = stars[index];
    if(!star) return '';
    const tag = star.querySelector('.constellation-star-tag');
    return tag ? tag.textContent.trim() : '';
  }

  function markNext(){
    stars.forEach((star,index)=>{
      star.classList.toggle('is-next', !solved && index === currentIndex + 1);
    });
  }

  function flashWrong(star){
    if(!star) return;
    star.classList.remove('wrong');
    void star.offsetWidth;
    star.classList.add('wrong');
    clearTimeout(wrongTimer);
    wrongTimer = window.setTimeout(()=>{
      star.classList.remove('wrong');
    }, 360);
  }

  function connect(index){
    if(solved) return;
    const expected = currentIndex + 1;
    if(index !== expected){
      flashWrong(stars[index]);
      return;
    }

    stars[index].classList.add('connected');
    if(index > 0 && lines[index - 1]){
      lines[index - 1].classList.add('active');
    }
    currentIndex = index;

    if(currentIndex >= stars.length - 1){
      solved = true;
      CONSTELLATION_SOLVED_IDS.add(item.id);
      wrap.classList.add('solved');
      setStatus(`${item.constellationName || '星座'} 已经亮起来了，我们在新加坡的回忆出现了。`);
      startAutoTypewriters(wrap, true);
    }else{
      setStatus(`很好，再把 ${getStarTag(currentIndex + 1) || '下一颗星'} 连上去。`);
    }
    markNext();
  }

  stars.forEach((star,index)=>{
    const onClick = event=>{
      event.preventDefault();
      connect(index);
    };
    star.addEventListener('click', onClick);
    listeners.push([star,'click',onClick]);
  });

  markNext();
  setStatus(`从 ${getStarTag(0) || '第一颗星'} 开始，把 ${item.constellationName || '星座'} 慢慢点亮。`);

  INTERACTIVE_STATE.constellation = {
    stop(){
      clearTimeout(wrongTimer);
      listeners.forEach(([node,type,handler])=>node.removeEventListener(type,handler));
    }
  };
}

function initMediaCarousel(item){
  if(!item) return;
  const frame = document.getElementById(`media-carousel-frame-${item.id}`);
  const track = document.getElementById(`media-carousel-track-${item.id}`);
  const dotsWrap = document.getElementById(`media-carousel-dots-${item.id}`);
  const prevButton = document.getElementById(`media-carousel-prev-${item.id}`);
  const nextButton = document.getElementById(`media-carousel-next-${item.id}`);
  if(!frame || !track || !dotsWrap || !prevButton || !nextButton) return;

  const slides = Array.from(track.querySelectorAll('.media-carousel-slide'));
  const dots = Array.from(dotsWrap.querySelectorAll('.media-carousel-dot'));
  const total = slides.length;
  if(!total) return;

  const intervalMs = Math.max(1200, Number(item.intervalMs) || 2000);
  let activeIndex = 0;
  let paused = false;
  let timerId = 0;
  let activeVideo = null;

  function getActiveVideo(){
    return slides[activeIndex]?.querySelector('video') || null;
  }

  function onActiveVideoEnded(){
    if(paused) return;
    activeIndex = (activeIndex + 1) % total;
    sync();
    schedule();
  }

  function syncVideoState(){
    slides.forEach((slide, index)=>{
      slide.classList.toggle('active', index === activeIndex);
      const video = slide.querySelector('video');
      if(!video) return;
      video.muted = true;
      if(index !== activeIndex){
        video.pause();
        video.currentTime = 0;
        return;
      }
      if(activeVideo !== video){
        if(activeVideo){
          activeVideo.removeEventListener('ended', onActiveVideoEnded);
        }
        activeVideo = video;
        activeVideo.addEventListener('ended', onActiveVideoEnded);
        video.currentTime = 0;
      }
      const playing = video.play();
      if(playing && typeof playing.catch === 'function'){
        playing.catch(()=>{});
      }
    });
    if(!getActiveVideo() && activeVideo){
      activeVideo.removeEventListener('ended', onActiveVideoEnded);
      activeVideo = null;
    }
  }

  function sync(){
    track.style.transform = `translateX(-${activeIndex * 100}%)`;
    dots.forEach((dot, index)=>dot.classList.toggle('active', index === activeIndex));
    syncVideoState();
  }

  function clearTimer(){
    if(timerId){
      clearTimeout(timerId);
      timerId = 0;
    }
  }

  function schedule(){
    clearTimer();
    if(paused || total <= 1) return;
    if(getActiveVideo()) return;
    timerId = window.setTimeout(()=>{
      activeIndex = (activeIndex + 1) % total;
      sync();
      schedule();
    }, intervalMs);
  }

  function goTo(index){
    activeIndex = ((index % total) + total) % total;
    sync();
    schedule();
  }

  function step(direction){
    goTo(activeIndex + direction);
  }

  function onPrevClick(){
    step(-1);
  }

  function onNextClick(){
    step(1);
  }

  function onPointerEnter(){
    paused = true;
    clearTimer();
  }

  function onPointerLeave(){
    paused = false;
    schedule();
  }

  frame.addEventListener('mouseenter', onPointerEnter);
  frame.addEventListener('mouseleave', onPointerLeave);
  dots.forEach((dot, index)=>{
    dot.addEventListener('click',()=>goTo(index));
  });
  prevButton.addEventListener('click', onPrevClick);
  nextButton.addEventListener('click', onNextClick);

  sync();
  schedule();

  INTERACTIVE_STATE.mediaCarousel = {
    stop(){
      paused = true;
      clearTimer();
      frame.removeEventListener('mouseenter', onPointerEnter);
      frame.removeEventListener('mouseleave', onPointerLeave);
      prevButton.removeEventListener('click', onPrevClick);
      nextButton.removeEventListener('click', onNextClick);
      if(activeVideo){
        activeVideo.removeEventListener('ended', onActiveVideoEnded);
        activeVideo = null;
      }
      slides.forEach(slide=>{
        const video = slide.querySelector('video');
        if(video){
          video.pause();
          video.currentTime = 0;
        }
      });
    }
  };
}

function initTypewriterNarrative(item){
  if(!item) return;
  const wrap = document.getElementById(`typewriter-${item.id}`);
  if(!wrap) return;

  const musicSrc = typeof item.music === 'string' ? item.music.trim() : '';
  const canBindMusic = !!musicSrc;

  async function tryPlayMusic(){
    if(!canBindMusic) return;
    await tryPlayPersistentBackgroundMusic(musicSrc);
  }

  function onSurfacePointer(){
    tryPlayMusic();
  }

  const mediaVideo = wrap.querySelector('video[data-autoplay-on-visible="1"]');
  let revealObserver = null;
  let playTimer = 0;

  function tryPlayVisibleVideo(forceRestart=false){
    if(!mediaVideo || !wrap.classList.contains('done')) return;
    try{
      mediaVideo.muted = true;
      if(forceRestart){
        mediaVideo.currentTime = 0;
      }
      const playing = mediaVideo.play();
      if(playing && typeof playing.catch === 'function'){
        playing.catch(()=>{});
      }
    }catch(_err){}
  }

  if(mediaVideo){
    if(wrap.classList.contains('done')){
      playTimer = window.setTimeout(()=>{
        playTimer = 0;
        tryPlayVisibleVideo(true);
      }, 180);
    }else if('MutationObserver' in window){
      revealObserver = new MutationObserver(()=>{
        if(!wrap.classList.contains('done')) return;
        if(playTimer){
          clearTimeout(playTimer);
          playTimer = 0;
        }
        playTimer = window.setTimeout(()=>{
          playTimer = 0;
          tryPlayVisibleVideo(true);
        }, 240);
        if(revealObserver){
          revealObserver.disconnect();
          revealObserver = null;
        }
      });
      revealObserver.observe(wrap,{attributes:true, attributeFilter:['class']});
    }
  }

  if(canBindMusic){
    wrap.addEventListener('pointerdown', onSurfacePointer);
    tryPlayMusic();
  }

  INTERACTIVE_STATE.typewriter = {
    stop(){
      if(canBindMusic){
        wrap.removeEventListener('pointerdown', onSurfacePointer);
      }
      if(revealObserver){
        revealObserver.disconnect();
        revealObserver = null;
      }
      if(playTimer){
        clearTimeout(playTimer);
        playTimer = 0;
      }
      if(mediaVideo){
        try{
          mediaVideo.pause();
          mediaVideo.currentTime = 0;
        }catch(_err){}
      }
    }
  };
}

function initWishBlower(item){
  if(!item) return;
  const wrap = document.getElementById(`wish-${item.id}`);
  const startButton = document.getElementById(`wish-start-${item.id}`);
  const status = document.getElementById(`wish-status-${item.id}`);
  const meter = document.getElementById(`wish-meter-${item.id}`);
  if(!wrap || !startButton || !status || !meter) return;

  const configuredThresholdDb = Number.isFinite(Number(item.thresholdDb)) ? Number(item.thresholdDb) : -42;
  let stream = null;
  let context = null;
  let source = null;
  let analyser = null;
  let rafId = 0;
  let armed = false;
  let extinguished = false;
  let charge = 0;
  let destroyed = false;
  let baselineDb = -58;
  let triggerDb = configuredThresholdDb;
  let loudestDb = -100;
  let smoothedDb = -100;
  let activeFrames = 0;
  const extinguishTarget = 2.35;

  function setMeter(value){
    const pct = Math.max(4, Math.min(100, value * 100));
    meter.style.width = `${pct.toFixed(1)}%`;
  }

  function stopCapture(){
    if(rafId){
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
    if(source){
      try{source.disconnect();}catch(_err){}
      source = null;
    }
    if(analyser){
      try{analyser.disconnect();}catch(_err){}
      analyser = null;
    }
    if(stream){
      stream.getTracks().forEach(track=>track.stop());
      stream = null;
    }
    if(context){
      const closing = context.close();
      if(closing && typeof closing.catch === 'function'){
        closing.catch(()=>{});
      }
      context = null;
    }
  }

  function extinguish(){
    if(extinguished) return;
    extinguished = true;
    wrap.classList.add('extinguished');
    status.textContent = '火焰熄灭。生日祝福已点亮。';
    setMeter(1);
    startButton.disabled = true;
    startAutoTypewriters(wrap, true);
    setTimeout(stopCapture, 200);
  }

  async function startListening(){
    if(armed || extinguished || destroyed) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      status.textContent = '当前浏览器不支持麦克风检测。';
      return;
    }

    armed = true;
    startButton.disabled = true;
    status.textContent = '正在请求麦克风权限...';

    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:false,
          noiseSuppression:false,
          autoGainControl:false,
          channelCount:1
        }
      });
    }catch(_err){
      if(destroyed) return;
      armed = false;
      startButton.disabled = false;
      status.textContent = '未获得麦克风权限，无法吹灭蜡烛。';
      return;
    }
    if(destroyed){
      stopCapture();
      return;
    }

    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      context = new AudioCtx();
      if(context.state === 'suspended'){
        await context.resume();
      }
      source = context.createMediaStreamSource(stream);
      analyser = context.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.32;
      source.connect(analyser);
    }catch(_err){
      if(destroyed) return;
      armed = false;
      startButton.disabled = false;
      status.textContent = '音频分析初始化失败。';
      stopCapture();
      return;
    }

    const data = new Uint8Array(analyser.fftSize);
    const calibrationSamples = [];
    let frameCount = 0;
    status.textContent = '麦克风已连接，先保持安静半秒，正在校准灵敏度...';

    function getSignalLevelDb(){
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      let peak = 0;
      for(let i=0;i<data.length;i++){
        const n = (data[i] - 128) / 128;
        const abs = Math.abs(n);
        sum += n * n;
        if(abs > peak) peak = abs;
      }
      const rms = Math.sqrt(sum / data.length);
      let rmsDb = rms > 0 ? 20 * Math.log10(rms) : -100;
      let peakDb = peak > 0 ? 20 * Math.log10(peak) : -100;
      if(!Number.isFinite(rmsDb)) rmsDb = -100;
      if(!Number.isFinite(peakDb)) peakDb = -100;
      return Math.max(rmsDb, peakDb - 10);
    }

    function monitor(){
      if(!analyser || extinguished || destroyed) return;
      frameCount += 1;
      const db = getSignalLevelDb();
      smoothedDb = smoothedDb <= -99 ? db : (smoothedDb * 0.82 + db * 0.18);
      const sensedDb = Math.max(db, smoothedDb);
      loudestDb = Math.max(loudestDb, sensedDb);

      if(calibrationSamples.length < 30){
        calibrationSamples.push(sensedDb);
        const sorted = [...calibrationSamples].sort((a,b)=>a-b);
        const median = sorted[Math.floor(sorted.length / 2)];
        baselineDb = Math.max(-72, Math.min(-24, median));
        triggerDb = Math.min(-30, Math.max(configuredThresholdDb, baselineDb + 14));
        const setupLevel = Math.max(0, Math.min(0.2, (sensedDb - baselineDb + 4) / 26));
        setMeter(setupLevel);
        status.textContent = '麦克风已连接，正在校准灵敏度...';
        rafId = requestAnimationFrame(monitor);
        return;
      }

      const deltaDb = sensedDb - baselineDb;
      const visualLevel = Math.max(0, Math.min(1, (deltaDb - 5) / 18));
      const detectedBlow = sensedDb >= triggerDb && deltaDb >= 12;

      if(detectedBlow){
        activeFrames = Math.min(18, activeFrames + 1);
      }else{
        activeFrames = Math.max(0, activeFrames - 2);
        baselineDb = Math.max(-72, Math.min(-24, baselineDb * 0.992 + Math.min(sensedDb, baselineDb + 1.2) * 0.008));
      }

      if(activeFrames >= 4){
        const boost = 0.014 + Math.min(0.018, Math.max(0, deltaDb - 12) / 220);
        charge = Math.min(extinguishTarget + 0.1, charge + boost);
      }else{
        charge = Math.max(0, charge - 0.018);
      }

      const progress = Math.max(0, Math.min(1, charge / extinguishTarget));
      setMeter(Math.max(progress, visualLevel * 0.32));

      const shownDb = Math.max(-60, Math.round(sensedDb));
      const shownTrigger = Math.max(-60, Math.round(triggerDb));
      if(activeFrames >= 4){
        if(progress < 0.28){
          status.textContent = `检测到 ${shownDb} dB，火苗开始摇晃了，继续稳定吹气`;
        }else if(progress < 0.58){
          status.textContent = `检测到 ${shownDb} dB，火苗变小了，别停`;
        }else if(progress < 0.88){
          status.textContent = `检测到 ${shownDb} dB，已经快熄灭了，再坚持一下`;
        }else{
          status.textContent = `检测到 ${shownDb} dB，最后一口气就能吹灭`;
        }
      }else if(detectedBlow){
        status.textContent = `检测到一点气流 ${shownDb} dB，再持续吹一下，火苗才会真正变弱`;
      }else if(frameCount > 140 && loudestDb < triggerDb - 4){
        status.textContent = `麦克风已开，但变化太小。请更靠近麦克风吹气，或换 Chrome / Safari 再试（当前目标 ${shownTrigger} dB）`;
      }else{
        status.textContent = `当前音量 ${shownDb} dB，持续吹到 ${shownTrigger} dB 左右，火苗才会慢慢变弱`;
      }
      if(charge >= extinguishTarget){
        extinguish();
        return;
      }
      rafId = requestAnimationFrame(monitor);
    }

    monitor();
  }

  startButton.addEventListener('click', startListening);

  INTERACTIVE_STATE.wishBlower = {
    stop(){
      destroyed = true;
      startButton.removeEventListener('click', startListening);
      stopCapture();
    }
  };
}

function encodeCssUrl(url=''){
  const safeUrl = safeMediaSrc(url);
  return safeUrl.replace(/'/g,'%27').replace(/\(/g,'%28').replace(/\)/g,'%29');
}

function getJigsawStageRatio(item){
  const raw = typeof item?.stageRatio === 'string' ? item.stageRatio.trim() : '';
  return raw || '4/3';
}

function getJigsawImageLayer(item){
  const raw = typeof item.image === 'string' ? item.image.trim() : '';
  if(raw){
    return `url('${encodeCssUrl(raw)}')`;
  }
  return 'radial-gradient(circle at 22% 28%, rgba(255,213,242,.28), rgba(255,213,242,0) 46%),' +
         'radial-gradient(circle at 78% 72%, rgba(155,132,255,.24), rgba(155,132,255,0) 52%),' +
         'linear-gradient(145deg, rgba(76,55,140,.82), rgba(34,24,74,.9))';
}

function buildJigsawPhotoStyle(item){
  return `background-image:${getJigsawImageLayer(item)};`;
}

function buildJigsawStageStyle(item){
  return `aspect-ratio:${getJigsawStageRatio(item)};`;
}

function buildJigsawPieceStyle(item, idx, gridSize){
  const row = Math.floor(idx / gridSize);
  const col = idx % gridSize;
  const x = gridSize === 1 ? 50 : (col / (gridSize - 1)) * 100;
  const y = gridSize === 1 ? 50 : (row / (gridSize - 1)) * 100;
  return `background-image:${getJigsawImageLayer(item)};` +
         `aspect-ratio:${getJigsawStageRatio(item)};` +
         `background-size:${gridSize * 100}% ${gridSize * 100}%;` +
         `background-position:${x}% ${y}%;`;
}

function initJigsaw(item){
  const gridSize = Math.max(2, Math.min(5, Number(item.grid) || 3));
  const total = gridSize * gridSize;
  const useAroundTray = item.trayLayout === 'around';
  const wrap = document.getElementById(`jig-wrap-${item.id}`);
  const grid = document.getElementById(`jig-grid-${item.id}`);
  const tray = document.getElementById(`jig-tray-${item.id}`);
  const trayFloor = document.getElementById(`jig-tray-floor-${item.id}`);
  const trayTop = document.getElementById(`jig-tray-top-${item.id}`);
  const trayRight = document.getElementById(`jig-tray-right-${item.id}`);
  const trayLeft = document.getElementById(`jig-tray-left-${item.id}`);
  const status = document.getElementById(`jig-status-${item.id}`);
  const fireworks = document.getElementById(`jig-fire-${item.id}`);
  if(!wrap || !grid || !status || !fireworks) return;
  if(useAroundTray && (!trayTop || !trayRight || !trayLeft)) return;
  if(!useAroundTray && !tray) return;

  // 本次会话中已拼完过，直接跳到完成态，不重复解谜
  if(JIGSAW_SOLVED_IDS.has(item.id)){
    wrap.classList.remove('completed','settled');
    grid.innerHTML = '';
    [tray, trayFloor, trayTop, trayRight, trayLeft].forEach(n=>{ if(n) n.innerHTML = ''; });
    // 快速填入所有格子（视觉完整）
    for(let i = 0; i < total; i++){
      const slot = document.createElement('div');
      slot.className = 'jigsaw-slot filled';
      slot.dataset.slot = String(i);
      const piece = document.createElement('div');
      piece.className = 'jigsaw-piece';
      piece.dataset.piece = String(i);
      piece.style.cssText = buildJigsawPieceStyle(item, i, gridSize);
      slot.appendChild(piece);
      grid.appendChild(slot);
    }
    status.textContent = `已拼好 ${total} / ${total} 块 · 全部拼好啦！`;
    wrap.classList.add('completed','settled');
    startAutoTypewriters(wrap, true);
    const hintElSkip = wrap.querySelector('.jigsaw-hint');
    if(hintElSkip) hintElSkip.textContent = '厉害哈！';
    return;
  }

  wrap.classList.remove('completed');
  wrap.classList.remove('settled');
  grid.innerHTML = '';
  [tray, trayFloor, trayTop, trayRight, trayLeft].forEach(node=>{
    if(node) node.innerHTML = '';
  });

  const pieces = new Map();
  let placed = 0;
  let solved = false;
  let selectedPiece = null;
  const trayNodes = useAroundTray
    ? [trayTop, trayRight, trayLeft].filter(Boolean)
    : [tray, trayFloor].filter(Boolean);

  function updateStatus(){
    status.textContent = `已拼好 ${placed} / ${total} 块`;
    if(placed === total){
      status.textContent += ' · 全部拼好啦！';
    }
  }

  function clearSelectedPiece(){
    if(selectedPiece){
      selectedPiece.classList.remove('selected');
    }
    selectedPiece = null;
    wrap.classList.remove('has-picked');
  }

  function selectPiece(piece){
    if(!piece || !trayNodes.includes(piece.parentElement)) return;
    if(selectedPiece === piece){
      clearSelectedPiece();
      return;
    }
    if(selectedPiece){
      selectedPiece.classList.remove('selected');
    }
    selectedPiece = piece;
    selectedPiece.classList.add('selected');
    wrap.classList.add('has-picked');
  }

  function flashWrong(slot, piece){
    if(slot){
      slot.classList.remove('slot-wrong');
      void slot.offsetWidth;
      slot.classList.add('slot-wrong');
      setTimeout(()=>slot.classList.remove('slot-wrong'), 360);
    }
    if(piece){
      piece.classList.remove('flash-wrong');
      void piece.offsetWidth;
      piece.classList.add('flash-wrong');
      setTimeout(()=>piece.classList.remove('flash-wrong'), 360);
    }
  }

  function lockPieceToSlot(piece, slot){
    if(!piece || !slot || slot.classList.contains('filled')) return;
    slot.classList.add('filled');
    piece.draggable = false;
    piece.classList.remove('dragging');
    piece.classList.remove('selected');
    slot.appendChild(piece);
    if(selectedPiece === piece){
      clearSelectedPiece();
    }
    placed += 1;
    updateStatus();
    if(!solved && placed === total){
      solved = true;
      JIGSAW_SOLVED_IDS.add(item.id);
      wrap.classList.add('completed');
      playJigsawFireworks(fireworks, {
        durationMs:Number(item.fireworksDurationMs) || 2600
      });
      startAutoTypewriters(wrap, true);
      const hintEl = wrap.querySelector('.jigsaw-hint');
      if(hintEl) hintEl.textContent = '厉害哈！';
      requestAnimationFrame(()=>{
        if(!wrap.isConnected) return;
        wrap.classList.add('settled');
      });
    }
  }

  function getAroundTrayCounts(pieceTotal){
    const counts = {
      top:Math.floor(pieceTotal / 3),
      right:Math.floor(pieceTotal / 3),
      left:Math.floor(pieceTotal / 3)
    };
    const extraOrder = ['top','left','right'];
    let extras = pieceTotal - (counts.top + counts.right + counts.left);
    let cursor = 0;
    while(extras > 0){
      counts[extraOrder[cursor]] += 1;
      extras -= 1;
      cursor += 1;
    }
    return counts;
  }

  for(let i=0;i<total;i++){
    const slot = document.createElement('div');
    slot.className = 'jigsaw-slot';
    slot.dataset.slot = String(i);
    slot.addEventListener('click',()=>{
      if(slot.classList.contains('filled') || !selectedPiece) return;
      const selectedIndex = Number(selectedPiece.dataset.piece);
      if(selectedIndex === i){
        lockPieceToSlot(selectedPiece, slot);
      }else{
        flashWrong(slot, selectedPiece);
      }
    });
    slot.addEventListener('dragover',e=>{
      if(slot.classList.contains('filled')) return;
      e.preventDefault();
      slot.classList.add('drag-over');
      e.dataTransfer.dropEffect = 'move';
    });
    slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));
    slot.addEventListener('drop',e=>{
      e.preventDefault();
      slot.classList.remove('drag-over');
      if(slot.classList.contains('filled')) return;
      const dragged = Number(e.dataTransfer.getData('text/plain'));
      if(Number.isNaN(dragged)) return;
      const piece = pieces.get(dragged);
      if(dragged === i){
        lockPieceToSlot(piece, slot);
      }else{
        flashWrong(slot, piece);
      }
    });
    grid.appendChild(slot);
  }

  const order = Array.from({length:total},(_,i)=>i).sort(()=>Math.random() - 0.5);
  const aroundCounts = useAroundTray ? getAroundTrayCounts(total) : null;
  const aroundBuckets = useAroundTray
    ? [
        {node:trayTop, count:aroundCounts.top, columns:Math.max(1, aroundCounts.top)},
        {node:trayRight, count:aroundCounts.right, columns:1},
        {node:trayLeft, count:aroundCounts.left, columns:1}
      ]
    : [];

  aroundBuckets.forEach(bucket=>{
    if(!bucket.node) return;
    bucket.node.style.setProperty('--tray-columns', String(bucket.columns));
  });

  const sideCount = !useAroundTray && trayFloor ? Math.ceil(total / 2) : total;
  let aroundCursor = 0;

  function getAroundBucket(){
    while(aroundCursor < aroundBuckets.length && aroundBuckets[aroundCursor].count <= 0){
      aroundCursor += 1;
    }
    return aroundBuckets[aroundCursor] || null;
  }

  order.forEach(idx=>{
    const piece = document.createElement('div');
    piece.className = 'jigsaw-piece';
    piece.draggable = true;
    piece.dataset.piece = String(idx);
    piece.setAttribute('aria-label', `puzzle piece ${idx + 1}`);
    piece.tabIndex = 0;
    piece.style.cssText = buildJigsawPieceStyle(item, idx, gridSize);
    piece.addEventListener('click',()=>selectPiece(piece));
    piece.addEventListener('keydown',e=>{
      if(e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      selectPiece(piece);
    });
    piece.addEventListener('dragstart',e=>{
      clearSelectedPiece();
      piece.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(idx));
    });
    piece.addEventListener('dragend',()=>piece.classList.remove('dragging'));
    pieces.set(idx, piece);
    if(useAroundTray){
      const bucket = getAroundBucket();
      if(bucket && bucket.node){
        bucket.node.appendChild(piece);
        bucket.count -= 1;
      }
      return;
    }
    if(trayFloor && tray.childElementCount >= sideCount){
      trayFloor.appendChild(piece);
    }else{
      tray.appendChild(piece);
    }
  });

  updateStatus();
}

function playJigsawFireworks(canvas, options={}){
  if(!(canvas instanceof HTMLCanvasElement)) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const width = Math.max(1, Math.floor(rect.width));
  const height = Math.max(1, Math.floor(rect.height));
  const durationMs = Math.max(1400, Number(options.durationMs) || 2600);
  const burstIntervalMs = Math.max(280, Number(options.burstIntervalMs) || 420);
  const anchors = Array.isArray(options.anchors) && options.anchors.length
    ? options.anchors
    : [
        {x:width * 0.14, y:height * 0.2},
        {x:width * 0.2, y:height * 0.46},
        {x:width * 0.18, y:height * 0.72},
        {x:width * 0.82, y:height * 0.24},
        {x:width * 0.88, y:height * 0.5},
        {x:width * 0.8, y:height * 0.76}
      ];

  canvas.width = Math.max(1, Math.floor(width * dpr));
  canvas.height = Math.max(1, Math.floor(height * dpr));
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const particles = [];
  const startedAt = performance.now();
  let lastBurstAt = startedAt - burstIntervalMs;

  function spawnBurst(){
    anchors.forEach((anchor, burstIndex)=>{
      const count = 28 + Math.round(Math.random() * 18);
      for(let i=0;i<count;i++){
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.32;
        const speed = 1.4 + Math.random() * 3.35;
        const life = 52 + Math.random() * 26;
        particles.push({
          x:anchor.x,
          y:anchor.y,
          vx:Math.cos(angle) * speed,
          vy:Math.sin(angle) * speed,
          life,
          maxLife:life,
          size:1 + Math.random() * 2.2,
          hue:262 + burstIndex * 12 + Math.random() * 44
        });
      }
    });
  }

  function frame(now){
    ctx.clearRect(0, 0, width, height);
    if(now - lastBurstAt >= burstIntervalMs && now - startedAt <= durationMs){
      spawnBurst();
      lastBurstAt = now;
    }
    ctx.shadowBlur = 8;
    ctx.shadowColor = 'rgba(220,180,255,0.45)';
    let alive = 0;
    for(const p of particles){
      if(p.life <= 0) continue;
      alive += 1;
      p.life -= 1;
      p.vy += 0.03;
      p.x += p.vx;
      p.y += p.vy;
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, 95%, 78%, ${alpha})`;
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    if(alive > 0 || now - startedAt <= durationMs){
      requestAnimationFrame(frame);
    }else{
      ctx.clearRect(0, 0, width, height);
    }
  }

  requestAnimationFrame(frame);
}

function buildMatchShotStyle(pair){
  const hasImage = typeof pair.image === 'string' && pair.image.trim() !== '';
  const imageLayer = hasImage ? `url('${encodeURI(pair.image.trim())}'), ` : '';
  const fragment = pair.fragment || '50% 50%';
  return `background-image:${imageLayer}linear-gradient(140deg, rgba(96,72,164,.75), rgba(49,38,94,.78));` +
         `background-position:${fragment},center;` +
         `background-size:260% 260%,cover;`;
}

function initMemoryMatch(item){
  if(!item || !Array.isArray(item.pairs) || item.pairs.length === 0) return;

  const wrap = document.getElementById(`memory-match-${item.id}`);
  const grid = document.getElementById(`mm-grid-${item.id}`);
  const gallery = document.getElementById(`mm-complete-${item.id}`);
  if(!wrap || !grid || !gallery) return;

  // 本次会话内已全部配对过 → 直接还原完成态，不重置游戏
  if(MEMORY_MATCH_SOLVED_IDS.has(item.id)){
    grid.style.display = 'none';
    gallery.innerHTML = '';
    item.pairs.forEach(pair=>{
      const safeSrc = typeof pair.image === 'string' && pair.image.trim()
        ? safeMediaSrc(pair.image.trim()) : '';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mm-complete-card'; // no 'pending' → immediately visible
      btn.setAttribute('aria-label', pair.label || item.place || 'memory');
      btn.innerHTML = `
        <span class="mm-complete-inner">
          <span class="mm-complete-face mm-complete-front">
            ${safeSrc ? `<img src="${escapeHtml(safeSrc)}" alt="${escapeHtml(pair.label || '')}">` : ''}
          </span>
          <span class="mm-complete-face mm-complete-back">
            <span class="mm-complete-label">${escapeHtml(pair.label || 'memory')}</span>
            <span class="mm-complete-secret">${escapeHtml(pair.secret || '')}</span>
          </span>
        </span>
      `;
      if(safeSrc){
        btn.addEventListener('click', ()=>openLightbox(safeSrc, pair.label || item.place || 'memory'));
      }
      gallery.appendChild(btn);
    });
    INTERACTIVE_STATE.memoryMatch = { stop(){} };
    return;
  }

  const deck = item.pairs.flatMap((pair, pairId)=>[
    {pairId, pair},
    {pairId, pair}
  ]).sort(()=>Math.random() - .5);

  // 提前预加载所有配对图片，避免首次翻牌时解码卡顿
  item.pairs.forEach(pair=>{
    if(typeof pair.image === 'string' && pair.image.trim()){
      const pre = new Image();
      pre.src = pair.image.trim();
    }
  });

  const state = {open:[], lock:false, matched:new Set(), revealedCard:null};
  const timers = new Set();
  const bindings = [];
  const activeGhosts = new Set();
  let destroyed = false;

  function queueDelay(ms){
    return new Promise(resolve=>{
      if(destroyed){
        resolve();
        return;
      }
      const id = setTimeout(()=>{
        timers.delete(id);
        resolve();
      }, ms);
      timers.add(id);
    });
  }

  function collapseRevealed(exceptCard=null){
    if(state.revealedCard && state.revealedCard !== exceptCard){
      state.revealedCard.classList.remove('revealed');
    }
    if(exceptCard == null){
      state.revealedCard = null;
    }
  }

  function toggleCompleteCard(card){
    if(destroyed || !card) return;
    const shouldReveal = !card.classList.contains('revealed');
    collapseRevealed(card);
    card.classList.toggle('revealed', shouldReveal);
    state.revealedCard = shouldReveal ? card : null;
  }

  function createCompleteCard(pair){
    const safeSrc = typeof pair.image === 'string' && pair.image.trim()
      ? safeMediaSrc(pair.image.trim())
      : '';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mm-complete-card pending';
    btn.setAttribute('aria-label', pair.label || item.place || 'memory');
    btn.innerHTML = `
      <span class="mm-complete-inner">
        <span class="mm-complete-face mm-complete-front">
          ${safeSrc ? `<img src="${escapeHtml(safeSrc)}" alt="${escapeHtml(pair.label || item.place || 'memory')}">` : ''}
        </span>
        <span class="mm-complete-face mm-complete-back">
          <span class="mm-complete-label">${escapeHtml(pair.label || 'memory')}</span>
          <span class="mm-complete-secret">${escapeHtml(pair.secret || '')}</span>
        </span>
      </span>
    `;
    let clickTimerId = 0;
    const onClick = event=>{
      event.preventDefault();
      if(clickTimerId){
        clearTimeout(clickTimerId);
        timers.delete(clickTimerId);
      }
      clickTimerId = setTimeout(()=>{
        timers.delete(clickTimerId);
        clickTimerId = 0;
        if(destroyed || !safeSrc) return;
        openLightbox(safeSrc, pair.label || item.place || 'memory');
      }, 230);
      timers.add(clickTimerId);
    };
    const onDoubleClick = event=>{
      event.preventDefault();
      if(clickTimerId){
        clearTimeout(clickTimerId);
        timers.delete(clickTimerId);
        clickTimerId = 0;
      }
      toggleCompleteCard(btn);
    };
    btn.addEventListener('click', onClick);
    btn.addEventListener('dblclick', onDoubleClick);
    bindings.push({node:btn, type:'click', handler:onClick});
    bindings.push({node:btn, type:'dblclick', handler:onDoubleClick});
    gallery.appendChild(btn);
    return btn;
  }

  function getUnionRect(aRect, bRect){
    const left = Math.min(aRect.left, bRect.left);
    const top = Math.min(aRect.top, bRect.top);
    const right = Math.max(aRect.right, bRect.right);
    const bottom = Math.max(aRect.bottom, bRect.bottom);
    return {
      left,
      top,
      width:right - left,
      height:bottom - top
    };
  }

  function getPreviewRect(startRect){
    const wrapRect = wrap.getBoundingClientRect();
    const maxWidth = Math.min(264, window.innerWidth * 0.32, wrapRect.width * 0.44);
    const width = Math.max(188, maxWidth);
    const height = width * (4 / 3);
    const left = Math.min(
      window.innerWidth - width - 16,
      Math.max(16, wrapRect.left + (wrapRect.width - width) / 2)
    );
    const top = Math.min(
      window.innerHeight - height - 24,
      Math.max(18, wrapRect.top + 26)
    );
    return {
      left,
      top,
      width:Math.max(width, startRect.width * 1.1),
      height:Math.max(height, startRect.height * 1.1)
    };
  }

  async function animateMatchedImage(pair, buttons, completeCard){
    const safeSrc = typeof pair.image === 'string' && pair.image.trim()
      ? safeMediaSrc(pair.image.trim())
      : '';
    if(!safeSrc || !completeCard || destroyed){
      if(completeCard){
        completeCard.classList.remove('pending');
      }
      return;
    }

    const [firstButton, secondButton] = buttons;
    const startRect = getUnionRect(
      firstButton.getBoundingClientRect(),
      secondButton.getBoundingClientRect()
    );
    const previewRect = getPreviewRect(startRect);
    const ghost = document.createElement('div');
    ghost.className = 'mm-match-ghost';
    ghost.innerHTML = `<img src="${escapeHtml(safeSrc)}" alt="${escapeHtml(pair.label || item.place || 'memory')}">`;
    ghost.style.left = `${startRect.left}px`;
    ghost.style.top = `${startRect.top}px`;
    ghost.style.width = `${startRect.width}px`;
    ghost.style.height = `${startRect.height}px`;
    ghost.style.opacity = '0';
    ghost.style.transform = 'scale(.84)';
    ghost.style.filter = 'blur(10px) saturate(1.14)';
    document.body.appendChild(ghost);
    activeGhosts.add(ghost);

    firstButton.classList.add('match-burst');
    secondButton.classList.add('match-burst');

    await queueDelay(70);
    if(destroyed) return;

    ghost.classList.add('preview');
    ghost.style.left = `${previewRect.left}px`;
    ghost.style.top = `${previewRect.top}px`;
    ghost.style.width = `${previewRect.width}px`;
    ghost.style.height = `${previewRect.height}px`;
    ghost.style.opacity = '1';
    ghost.style.transform = 'scale(1)';
    ghost.style.filter = 'blur(0) saturate(1.04)';

    await queueDelay(520);
    if(destroyed) return;

    const targetRect = completeCard.getBoundingClientRect();
    ghost.classList.add('to-gallery');
    ghost.style.left = `${targetRect.left}px`;
    ghost.style.top = `${targetRect.top}px`;
    ghost.style.width = `${targetRect.width}px`;
    ghost.style.height = `${targetRect.height}px`;
    ghost.style.opacity = '.94';
    ghost.style.transform = 'scale(1)';
    ghost.style.filter = 'blur(0) saturate(1)';

    await queueDelay(560);
    if(destroyed) return;

    completeCard.classList.remove('pending');
    firstButton.classList.remove('match-burst');
    secondButton.classList.remove('match-burst');
    ghost.remove();
    activeGhosts.delete(ghost);
  }

  function onCardClick(btn, entry){
    if(destroyed || state.lock) return;
    if(btn.classList.contains('matched') || btn.classList.contains('flipped')) return;

    btn.classList.add('flipped');
    state.open.push({btn, entry});
    if(state.open.length < 2) return;

    state.lock = true;
    const [a,b] = state.open;
    const matched = a.entry.pairId === b.entry.pairId;

    if(matched){
      const id = setTimeout(async ()=>{
        timers.delete(id);
        if(destroyed) return;
        a.btn.classList.add('matched');
        b.btn.classList.add('matched');
        if(!state.matched.has(a.entry.pairId)){
          state.matched.add(a.entry.pairId);
          const completeCard = createCompleteCard(a.entry.pair);
          await animateMatchedImage(a.entry.pair, [a.btn, b.btn], completeCard);
          if(destroyed) return;
          // 所有对都配对完成 → 记录会话状态，隐藏翻牌区
          if(state.matched.size >= item.pairs.length){
            MEMORY_MATCH_SOLVED_IDS.add(item.id);
            grid.style.display = 'none';
          }
        }
        state.open = [];
        state.lock = false;
      },220);
      timers.add(id);
    }else{
      const id = setTimeout(()=>{
        timers.delete(id);
        if(destroyed) return;
        a.btn.classList.remove('flipped');
        b.btn.classList.remove('flipped');
        state.open = [];
        state.lock = false;
      },850);
      timers.add(id);
    }
  }

  grid.innerHTML = '';
  deck.forEach(entry=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mm-card';
    btn.setAttribute('aria-label', 'memory card');
    btn.innerHTML = `
      <span class="mm-inner">
        <span class="mm-face mm-back"></span>
        <span class="mm-face mm-front">
          <span class="mm-shot" style="${buildMatchShotStyle(entry.pair)}"></span>
          <span class="mm-tag">${escapeHtml(entry.pair.label)}</span>
        </span>
      </span>
    `;
    const onClick = ()=>onCardClick(btn, entry);
    btn.addEventListener('click', onClick);
    bindings.push({node:btn, type:'click', handler:onClick});
    grid.appendChild(btn);
  });

  INTERACTIVE_STATE.memoryMatch = {
    stop(){
      destroyed = true;
      collapseRevealed();
      timers.forEach(clearTimeout);
      timers.clear();
      bindings.forEach(({node, type, handler})=>{
        node.removeEventListener(type, handler);
      });
      activeGhosts.forEach(ghost=>ghost.remove());
      activeGhosts.clear();
    }
  };
}

function normalizeUnlockCode(value=''){
  return String(value || '')
    .trim()
    .replace(/[０-９]/g, char=>String.fromCharCode(char.charCodeAt(0) - 65248))
    .replace(/\D+/g, '');
}

/* ====== 金色字符雨 ====== */
function startGoldCharRain(onDone){
  const CHARS = ['✦','★','♡','✿','❀','✸','❋','✤','✨','❤','喜'];
  const COLORS = [
    'rgba(255,214,90,',
    'rgba(255,188,60,',
    'rgba(255,238,140,',
    'rgba(255,248,190,',
    'rgba(255,200,80,',
    'rgba(255,228,110,'
  ];
  const RAIN_MS = 3000;
  const COUNT = 68;

  const overlay = document.createElement('div');
  overlay.className = 'gold-char-rain';
  overlay.setAttribute('aria-hidden','true');
  document.body.appendChild(overlay);

  for(let i = 0; i < COUNT; i++){
    const span = document.createElement('span');
    span.textContent = CHARS[Math.floor(Math.random() * CHARS.length)];
    const col = COLORS[Math.floor(Math.random() * COLORS.length)];
    const alpha = (0.52 + Math.random() * 0.48).toFixed(2);
    const x = (2 + Math.random() * 96).toFixed(1);
    const delay = (Math.random() * 2.5).toFixed(2);
    const dur = (1.8 + Math.random() * 1.4).toFixed(2);
    const size = Math.round(14 + Math.random() * 26);
    span.style.cssText =
      `left:${x}%;font-size:${size}px;color:${col}${alpha});` +
      `animation-delay:${delay}s;animation-duration:${dur}s;`;
    overlay.appendChild(span);
  }

  // 3s 后淡出，0.65s fade 结束后回调
  const t1 = window.setTimeout(()=>{
    overlay.classList.add('rain-fade');
    const t2 = window.setTimeout(()=>{
      overlay.remove();
      if(typeof onDone === 'function') onDone();
    }, 680);
    overlay._t2 = t2;
  }, RAIN_MS);
  overlay._t1 = t1;
}

function checkCode(answer,inputId,resultId,reward){
  const input = document.getElementById(inputId);
  const result = document.getElementById(resultId);
  if(!input || !result) return;
  const wrap = input.closest('.game-wrap');
  // 防重复触发
  if(wrap && wrap.classList.contains('unlocked')) return;

  const normalizedAnswer = normalizeUnlockCode(answer);
  const normalizedInput = normalizeUnlockCode(input.value);
  const compactAnswer = normalizedAnswer.replace(/^0+/, '') || '0';
  const compactInput = normalizedInput.replace(/^0+/, '') || '0';

  if(
    normalizedInput &&
    normalizedAnswer &&
    (normalizedInput === normalizedAnswer || compactInput === compactAnswer)
  ){
    // 1. 立即隐藏输入区域
    if(wrap) wrap.classList.add('unlocked');
    // 2. 金色字符雨与奖励内容同步出现：雨作为覆盖特效飘落，文字和图片同时从下方浮出
    startGoldCharRain(); // 只负责视觉特效，3.65s 后自动消失
    result.classList.add('text-typewriter');
    typeTextIntoElement(result, reward, {delay:180});
    result.style.color = 'rgba(245,234,255,.95)';
    // 双帧 rAF 确保 display:block 先稳定，再触发 opacity transition
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        if(wrap) wrap.classList.add('reward-ready');
      });
    });
  }else{
    if(result._typewriterController && typeof result._typewriterController.stop === 'function'){
      result._typewriterController.stop();
    }
    result.classList.remove('text-typewriter');
    result.textContent = '暗号不对，再试一次。';
    result.style.color = 'rgba(230,191,255,.72)';
    // 错误时直接用 inline style 让 result 可见，不触发 reward-ready（不展开照片）
    result.style.opacity = '1';
  }
}

function escapeHtml(str=''){
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function escapeJs(str=''){
  return String(str ?? '')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\r/g,'\\r')
    .replace(/\n/g,'\\n')
    .replace(/\u2028/g,'\\u2028')
    .replace(/\u2029/g,'\\u2029')
    .replace(/</g,'\\x3C')
    .replace(/>/g,'\\x3E');
}

/* =========== 音乐淡入淡出工具 =========== */
// 给任一 HTMLAudioElement 做软淡出；淡完自动 pause
function fadeAudioOut(audio, durationMs=3000){
  if(!audio) return;
  try{
    const startVol = audio.volume;
    if(audio.paused || startVol <= 0.001){
      try{ audio.pause(); }catch(_e){}
      return;
    }
    const steps = 40;
    const stepMs = durationMs / steps;
    let i = 0;
    clearAudioFade(audio);
    audio._fadeTimer = setInterval(()=>{
      i++;
      audio.volume = Math.max(0, startVol * (1 - i/steps));
      if(i >= steps){
        clearInterval(audio._fadeTimer);
        audio._fadeTimer = null;
        try{ audio.pause(); }catch(_e){}
      }
    }, stepMs);
  }catch(_e){}
}
// 给任一 HTMLAudioElement 从 0 软淡入到目标音量
function fadeAudioIn(audio, targetVol=0.7, durationMs=4000){
  if(!audio) return;
  try{
    audio.volume = 0;
    const p = audio.play();
    if(p && typeof p.catch === 'function') p.catch(()=>{});
    const steps = 40;
    const stepMs = durationMs / steps;
    let i = 0;
    clearAudioFade(audio);
    audio._fadeTimer = setInterval(()=>{
      i++;
      audio.volume = Math.min(targetVol, targetVol * (i/steps));
      if(i >= steps){
        clearInterval(audio._fadeTimer);
        audio._fadeTimer = null;
      }
    }, stepMs);
  }catch(_e){}
}

  window.addEventListener('touchstart', retry, true);
  window.addEventListener('keydown', retry, true);
}

function finishFinalLetterAudioDominance(){
  const audio = FINAL_LETTER_AUDIO_STATE.audio;
  FINAL_LETTER_AUDIO_STATE.active = false;
  clearTimeout(FINAL_LETTER_AUDIO_STATE.resumeTimer);
  if(audio){
    clearAudioFade(audio);
    try{ audio.pause(); }catch(_e){}
  }
  FINAL_LETTER_AUDIO_STATE.resumeTimer = window.setTimeout(()=>{
    FINAL_LETTER_AUDIO_STATE.resumeTimer = 0;
    resumeHomePlaylistAfterEnvelope();
  }, 220);
}

function requestFinalLetterAudioRelease(){
  // 仅在需要强制释放信件音乐主导权时调用；
  // 普通收起信封不应该打断这首歌。
  if(FINAL_LETTER_AUDIO_STATE.active){
    finishFinalLetterAudioDominance();
  }
}

function startFinalLetterAudioDominance(){
  if(FINAL_LETTER_AUDIO_STATE.active) return;
  pauseHomePlaylistForEnvelope();
  if(BIRTHDAY_INTRO_STATE.audio){
    fadeAudioOut(BIRTHDAY_INTRO_STATE.audio, 2800);
  }

  const audio = ensureFinalLetterAudio();
  clearTimeout(FINAL_LETTER_AUDIO_STATE.resumeTimer);
  FINAL_LETTER_AUDIO_STATE.resumeTimer = 0;
  FINAL_LETTER_AUDIO_STATE.active = true;
  FINAL_LETTER_AUDIO_STATE.playedThisVisit = true;

  if(audio._letterEnded){
    audio.removeEventListener('ended', audio._letterEnded);
  }
  audio._letterEnded = ()=>{
    if(!FINAL_LETTER_AUDIO_STATE.active) return;
    finishFinalLetterAudioDominance();
  };
  audio.addEventListener('ended', audio._letterEnded);

  clearAudioFade(audio);
  try{
    audio.pause();
    audio.currentTime = 0;
  }catch(_e){}
  try{
    audio.volume = 0;
    const attempt = audio.play();
    const beginFade = ()=>{
      const steps = 40;
      const stepMs = 5000 / steps;
      let i = 0;
      clearAudioFade(audio);
      audio._fadeTimer = setInterval(()=>{
        i += 1;
        audio.volume = Math.min(LETTER_MUSIC_VOLUME, LETTER_MUSIC_VOLUME * (i / steps));
        if(i >= steps){
          clearInterval(audio._fadeTimer);
          audio._fadeTimer = null;
        }
      }, stepMs);
    };
    if(attempt && typeof attempt.then === 'function'){
      attempt.then(beginFade).catch(()=>bindFinalLetterAudioRetry());
    }else{
      beginFade();
    }
  }catch(_e){
    bindFinalLetterAudioRetry();
  }
}

function revealFinalLetterHint(text){
  const hint = document.getElementById('final-letter-hint');
  if(!hint) return;
  hint.style.animation = 'none';
  hint.textContent = text;
  hint.style.transition = 'none';
  hint.style.opacity = '0';
  hint.style.transform = 'translate(-50%, 8px)';
  hint.style.filter = 'blur(6px)';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      hint.style.transition = 'opacity .7s ease, transform .7s cubic-bezier(.2,.8,.24,1), filter .7s ease';
      hint.style.opacity = '1';
      hint.style.transform = 'translateX(-50%)';
      hint.style.filter = 'blur(0)';
    });
  });
}

function openFinalLetter(){
  if(FINAL_LETTER_OPENED) return;
  clearFinalLetterUiTimers();
  FINAL_LETTER_OPENED = true;
  markFinalLetterEverOpened();
  const envelope = document.getElementById('final-envelope');
  if(!envelope) return;
  envelope.classList.add('opened');

  if(!FINAL_LETTER_AUDIO_STATE.playedThisVisit){
    startFinalLetterAudioDominance();
  }

  // === 背景退场：给 layer 挂 .reading，触发重度模糊 + 压暗 ===
  const layerEl = document.getElementById('final-letter-layer');
  if(layerEl){
    // 等翻盖开到一半再开始背景退场，情绪过渡更自然
    FINAL_LETTER_UI_STATE.readingTimer = window.setTimeout(()=>{
      FINAL_LETTER_UI_STATE.readingTimer = 0;
      layerEl.classList.add('reading');
    }, 400);
  }

  // === 标题孤独展示：信纸完全展开后测量信封高度，让标题精确居中在小矩形里 ===
  const letterSheet = document.querySelector('.final-letter-sheet');
  if(letterSheet){
    // 信纸展开动画约 1.45s（0.55s delay + 0.9s transition），等 1.6s 确保完全可见后再测量
    FINAL_LETTER_UI_STATE.titleSoloTimer = window.setTimeout(()=>{
      FINAL_LETTER_UI_STATE.titleSoloTimer = 0;
      const envelopeLetter = document.getElementById('final-envelope-letter');
      const titleEl = letterSheet.querySelector('.final-letter-title');
      if(envelopeLetter && titleEl){
        const cardRect = envelopeLetter.getBoundingClientRect();
        const titleRect = titleEl.getBoundingClientRect();
        // 标题中心距卡片顶部的距离
        const titleCenterFromCardTop = (titleRect.top - cardRect.top) + titleRect.height / 2;
        // 卡片中心
        const cardCenter = cardRect.height / 2;
        const offset = Math.max(0, cardCenter - titleCenterFromCardTop);
        letterSheet.style.setProperty('--title-center-y', `${offset}px`);
      }
      letterSheet.classList.add('title-solo');
    }, 1600);
  }

  // === 段落依次淡入（代替打字机）+ 每段下方可配图 ===
  const body = document.getElementById('final-letter-body');
  if(body){
    body.innerHTML = '';
    // 等翻盖先开 (~1.4s)，标题居中约 1.8s 过渡，再停约 2s 让标题独自呼吸；总共约 5.4s 后正文出现
    FINAL_LETTER_UI_STATE.bodyTimer = window.setTimeout(()=>{
      FINAL_LETTER_UI_STATE.bodyTimer = 0;
      // 正文开始前：取消居中，标题平滑滑回顶部（transition 1.8s）
      if(letterSheet) letterSheet.classList.remove('title-solo');
      const lines = FINAL_LETTER_TEXT.split('\n');
      const PARA_STEP_SEC = 2.6; // 段与段的间隔 — 够慢够静
      let shownIdx = 0;
      lines.forEach(line=>{
        if(!line.trim()){
          // 空行：当作段间留白，不参与动画
          const gap = document.createElement('p');
          body.appendChild(gap);
          return;
        }
        const p = document.createElement('p');
        p.textContent = line;
        p.className = 'fade-para';
        p.style.animationDelay = (shownIdx * PARA_STEP_SEC) + 's';
        body.appendChild(p);

        // 这一段对应的配图（如果有）
        const photos = FINAL_LETTER_PHOTOS[shownIdx];
        if(Array.isArray(photos) && photos.length){
          const strip = document.createElement('div');
          strip.className = 'final-letter-photos';
          // 文字先浮出，图再延后 1.2 秒跟上
          strip.style.animationDelay = (shownIdx * PARA_STEP_SEC + 1.2) + 's';
          photos.forEach(src=>{
            if(!src) return;
            const img = document.createElement('img');
            img.src = src;
            img.alt = '';
            img.loading = 'lazy';
            img.decoding = 'async';
            img.tabIndex = 0;
            img.setAttribute('role','button');
            img.setAttribute('aria-label','点击放大照片');
            img.setAttribute('data-lightbox-src', src);
            img.setAttribute('data-lightbox-alt', '');
            img.addEventListener('keydown', e=>{
              if(e.key === 'Enter' || e.key === ' '){
                e.preventDefault();
                openLightbox(src, '');
              }
            });
            // 图挂了的话悄悄藏掉，别打断氛围
            img.addEventListener('error', ()=>{ img.style.display = 'none'; });
            strip.appendChild(img);
          });
          body.appendChild(strip);
        }

        shownIdx++;
      });

      // 最后一段淡入完成时间：(shownIdx-1)*PARA_STEP_SEC + 2.6s 单段动画时长
      // 再让署名单独作为最后一层慢慢出现，之后再浮现爱心
      const lastParaDoneSec = (shownIdx - 1) * PARA_STEP_SEC + 2.6;
      FINAL_LETTER_UI_STATE.signatureTimer = window.setTimeout(()=>{
        FINAL_LETTER_UI_STATE.signatureTimer = 0;
        revealFinalLetterSignatures();
      }, (lastParaDoneSec + 1.2) * 1000);
      const heartDelayMs = (lastParaDoneSec + 3.4) * 1000;
      FINAL_LETTER_UI_STATE.heartTimer = window.setTimeout(()=>{
        FINAL_LETTER_UI_STATE.heartTimer = 0;
        attachFinalHeart(body);
      }, heartDelayMs);
    }, 5400); // 1.6s 等信封完全展开测量 + 1.8s 居中过渡 + 2s 标题独自呼吸
  }

  // 淡出信封提示文字（让注意力都在信上）
  const hint = document.getElementById('final-letter-hint');
  if(hint){
    hint.style.transition = 'opacity .8s ease';
    hint.style.opacity = '0';
  }
}

/* ==========  终章爱心 + 星光汇聚  ========== */
function attachFinalHeart(bodyEl){
  if(!bodyEl) return;
  // 心心应该挂在整封信的"最下面"—— 署名之后，不是夹在正文和署名之间。
  // 所以挂到 .final-letter-sheet 的末尾，而不是 body 内部。
  const sheet = bodyEl.closest('.final-letter-sheet') || bodyEl.parentElement;
  if(!sheet) return;
  // 防止重复追加（例如用户重开信件）
  if(sheet.querySelector('.final-letter-heart-wrap')) return;
  const wrap = document.createElement('div');
  wrap.className = 'final-letter-heart-wrap';
  wrap.innerHTML = `
    <div>
      <button type="button" class="final-letter-heart" aria-label="为这封信画个句号">❤</button>
      <div class="final-letter-heart-caption">亲爱的，生日快乐🎂</div>
    </div>
  `;
  sheet.appendChild(wrap);
  // 下一帧再加 .shown，触发淡入 transition
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>wrap.classList.add('shown'));
  });
  const heartBtn = wrap.querySelector('.final-letter-heart');
  heartBtn.addEventListener('click', triggerLetterFinale, {once:true});
  heartBtn.addEventListener('keydown', e=>{
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      triggerLetterFinale();
    }
  });
}

let FINAL_LETTER_FINALE_FIRED = false;

  if(FINAL_LETTER_FINALE_FIRED) return;
  FINAL_LETTER_FINALE_FIRED = true;

  clearTimeout(FINAL_LETTER_UI_STATE.finaleCooldownTimer);
  FINAL_LETTER_UI_STATE.finaleCooldownTimer = window.setTimeout(()=>{
    FINAL_LETTER_UI_STATE.finaleCooldownTimer = 0;
    FINAL_LETTER_FINALE_FIRED = false;

}

function dismissFinalLetter(){
  const layer = document.getElementById('final-letter-layer');

  FINAL_LETTER_UI_STATE.resetTimer = window.setTimeout(()=>{

function closeFinalLetter({fadeAway=false} = {}){
  const layer = document.getElementById('final-letter-layer');
  const envelope = document.getElementById('final-envelope');
  if(!layer || !envelope) return;

  clearFinalLetterUiTimers();

  // Step 1：先撤掉读信背景，挂上 .closing 让"合封顺序"的 transition-delay 生效
  layer.classList.remove('reading');
  envelope.classList.add('closing');
  envelope.classList.remove('opened');
  FINAL_LETTER_OPENED = false;
  // 视觉顺序：
  //   0    ~ 1.0s    信纸自然地缩回信封（用原打开时同一条 cubic-bezier，反向播）
  //   0.85 ~ 1.85s   封口翻下盖住（先等 .85s 再走 1s transform）
  //   0.95 ~ 1.55s   火漆印重现（等 .95s 再走 .6s）
  //   ~1.9s          信封静静合好，然后重新留下一个安静的未展开状态

  // Step 2：等合封动画走完后，清空正文并把顶部提示换成“静静放在这里”
  FINAL_LETTER_UI_STATE.resetTimer = window.setTimeout(()=>{
    FINAL_LETTER_UI_STATE.resetTimer = 0;
    envelope.classList.remove('closing');
    if(fadeAway){
      layer.classList.remove('reading');
      layer.classList.remove('active');
      layer.setAttribute('aria-hidden','true');
      updateTitleHeartEntrances();
      FINAL_LETTER_UI_STATE.resetTimer = window.setTimeout(()=>{
        FINAL_LETTER_UI_STATE.resetTimer = 0;
        resetFinalLetterVisualState('最后一封信，就静静放在这里');
      }, 1400);
      return;
    }
    const body = document.getElementById('final-letter-body');
    if(body) body.innerHTML = '';
    // 心心挂在 .final-letter-sheet 上（署名之后），body.innerHTML 清不掉它，手动移除
    const oldHeart = document.querySelector('.final-letter-heart-wrap');
    if(oldHeart) oldHeart.remove();
    // 重置标题居中状态，为下次打开做准备
    const oldSheet = document.querySelector('.final-letter-sheet');
    if(oldSheet){
      oldSheet.classList.remove('title-solo');
      oldSheet.style.removeProperty('--title-center-y');
    }
    resetFinalLetterSignatures();
    layer.setAttribute('aria-hidden','false');
    updateTitleHeartEntrances();
  }, 2200);
}

// 挂到 unlockTreasure 的尾巴上：每次宝藏进入 OPENED 集合都检查
(function hookUnlockTreasureForFinalLetter(){

/* ======================================================================
   金色流星（费城专用）：稳定地出现、配色鲜明、抓住后进入吹蜡烛
   ====================================================================== */
const GOLDEN_METEOR_STATE = {
  alive:false,
  timer:0,
  element:null,
  catchHandler:null
};

function philadelphiaTreasure(){
  return TREASURE_BY_ID.get('philadelphia') || null;
}

function isPhiladelphiaCatchActive(){
  const item = philadelphiaTreasure();
  if(!item) return false;
  if(!hasBirthdayTriggered()) return false;
  if(hasFreeTreasureMode()) return true; // 全部解锁后，金色流星继续作为装饰入口
  if(OPENED_TREASURE_IDS.has(item.id)) return false;
  return getNextLockedSequenceId() === item.id; // 只有轮到费城时才出现
}

function spawnGoldenMeteor(){
  if(GOLDEN_METEOR_STATE.alive) return;
  const layer = document.getElementById('meteors-layer');
  if(!layer) return;

  const meteor = document.createElement('div');
  meteor.className = 'meteor-streak catchable meteor-golden';

  // 起止位置：横穿屏幕，比普通流星稍微慢、稍微长
  const sx = -18 + Math.random()*40;
  const sy = 10 + Math.random()*42;
  const ex = sx + 130 + Math.random()*30;
  const ey = sy + 32 + Math.random()*22;
  const angle = 18 + Math.random()*10;
  const len = 220 + Math.random()*180; // 比普通略长
  const thick = 1.8 + Math.random()*1.3;
  const dur = 4500 + Math.random()*1400; // 普通是 3000-5600ms；金色 4500-5900ms 稍慢
  const op = .9;

  meteor.style.setProperty('--sx', `${sx}vw`);
  meteor.style.setProperty('--sy', `${sy}vh`);
  meteor.style.setProperty('--ex', `${ex}vw`);
  meteor.style.setProperty('--ey', `${ey}vh`);
  meteor.style.setProperty('--ang', `${angle}deg`);
  meteor.style.setProperty('--len', `${len}px`);
  meteor.style.setProperty('--thick', `${thick}px`);
  meteor.style.setProperty('--dur', `${dur}ms`);
  meteor.style.setProperty('--op', `${op}`);
  meteor.setAttribute('title','抓住这颗金色流星，解锁费城');
  meteor.dataset.golden = '1';

  GOLDEN_METEOR_STATE.alive = true;
  GOLDEN_METEOR_STATE.element = meteor;
  layer.appendChild(meteor);

  function cleanup(){
    if(meteor.dataset.gone === '1') return;
    meteor.dataset.gone = '1';
    meteor.remove();
    GOLDEN_METEOR_STATE.alive = false;
    GOLDEN_METEOR_STATE.element = null;
    GOLDEN_METEOR_STATE.catchHandler = null;
  }

  function catchMeteor(event){
    if(meteor.dataset.gone === '1') return;
    event.preventDefault();
    event.stopPropagation();
    const x = typeof event.clientX === 'number' ? event.clientX : innerWidth * 0.5;
    const y = typeof event.clientY === 'number' ? event.clientY : innerHeight * 0.35;
    spawnMeteorCatchBurst(x, y);
    cleanup();
    onGoldenMeteorCaught();
  }

  GOLDEN_METEOR_STATE.catchHandler = catchMeteor;
  meteor.addEventListener('pointerdown', catchMeteor);
  meteor.addEventListener('click', catchMeteor);
  meteor.addEventListener('animationend', cleanup, {once:true});
}

function tryCatchGoldenMeteorByProximity(event){
  if(!GOLDEN_METEOR_STATE.alive || !GOLDEN_METEOR_STATE.element || typeof GOLDEN_METEOR_STATE.catchHandler !== 'function') return;
  if(event.target && event.target.closest && event.target.closest('.meteor-golden')) return;
  // 有弹窗打开时不响应，避免在地点交互界面内被意外触发
  if(isAnyOverlayOpen()) return;

  const rect = GOLDEN_METEOR_STATE.element.getBoundingClientRect();
  if(!rect.width && !rect.height) return;

  const x = typeof event.clientX === 'number' ? event.clientX : 0;
  const y = typeof event.clientY === 'number' ? event.clientY : 0;
  const padX = 22;
  const padY = 20;
  const withinExpandedRect =
    x >= rect.left - padX &&
    x <= rect.right + padX &&
    y >= rect.top - padY &&
    y <= rect.bottom + padY;

  if(!withinExpandedRect) return;
  GOLDEN_METEOR_STATE.catchHandler(event);
}

document.addEventListener('pointerdown', tryCatchGoldenMeteorByProximity, true);

function onGoldenMeteorCaught(){
  const item = philadelphiaTreasure();
  if(!item) return;
  if(!isPhiladelphiaCatchActive()) return;
  // 关掉可能打开的其他弹窗
  if(document.getElementById('modal-bg')?.classList.contains('open')){
    closeModal();
  }
  // 标记已解锁（但只在费城是当前站或强制开放时生效，与 unlockTreasure 语义一致）
  unlockTreasure(item);
  updateTreasureLockState();
  if(OPENED_TREASURE_IDS.has(item.id) || hasFreeTreasureMode()){
    openTreasure(item);
  }
}

function startGoldenMeteorLoop(){
  // 持续心跳：频率比之前更密一点，让费城更容易被抓到
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(isPhiladelphiaCatchActive() && !GOLDEN_METEOR_STATE.alive){
    window.setTimeout(spawnGoldenMeteor, 520);
  }
  function tick(){
    if(isPhiladelphiaCatchActive() && !GOLDEN_METEOR_STATE.alive){
      spawnGoldenMeteor();
    }
    const wait = 3200 + Math.random()*2200;
    GOLDEN_METEOR_STATE.timer = window.setTimeout(tick, wait);
  }
  // 给点启动延迟，让页面先加载好
  GOLDEN_METEOR_STATE.timer = window.setTimeout(tick, 1400);
}
startGoldenMeteorLoop();

// 让费城的地图宝藏点：在费城尚未解锁时，禁止直接点击打开，必须去抓金流星
(function guardPhiladelphiaClick(){
  if(typeof handleTreasureClick !== 'function') return;
  const _orig = handleTreasureClick;
  handleTreasureClick = function(item){
    if(item && item.id === 'philadelphia' && !hasBirthdayTriggered()){
      return _orig.apply(this, arguments);
    }
    if(item && item.id === 'philadelphia'
       && !OPENED_TREASURE_IDS.has('philadelphia')
       && !hasFreeTreasureMode()){
      // 费城必须靠金色流星开启；直接点地图点不弹提示，只安静尝试放一颗流星。
      if(isPhiladelphiaCatchActive() && !GOLDEN_METEOR_STATE.alive){
        setTimeout(spawnGoldenMeteor, 400);
      }
      return;
    }
    return _orig.apply(this, arguments);
  };
})();
