function shouldPlayBirthdayIntro(){
  const timing = getBirthdayTimingState();
  return timing.inCountdown && !BIRTHDAY_INTRO_STATE.started && !BIRTHDAY_INTRO_STATE.done;
}

function markBirthdayIntroDone(){
  BIRTHDAY_INTRO_STATE.done = true;
}

function scheduleBirthdayIntroWatcher(){
  clearTimeout(BIRTHDAY_INTRO_STATE.scheduler);
  BIRTHDAY_INTRO_STATE.scheduler = 0;
  if(BIRTHDAY_INTRO_STATE.started || BIRTHDAY_INTRO_STATE.done) return;
  const timing = getBirthdayTimingState();
  if(timing.triggered) return;
  if(timing.inCountdown){
    startBirthdayIntro({triggerAt:timing.triggerAt});
    return;
  }
  const wait = Math.max(0, timing.countdownStartAt - Date.now());
  BIRTHDAY_INTRO_STATE.scheduler = window.setTimeout(()=>{
    BIRTHDAY_INTRO_STATE.scheduler = 0;
    maybeStartBirthdayIntroFromTiming();
  }, wait + 24);
}

function maybeStartBirthdayIntroFromTiming(){
  if(BIRTHDAY_INTRO_STATE.started || BIRTHDAY_INTRO_STATE.done) return;
  const timing = getBirthdayTimingState();
  if(timing.inCountdown){
    startBirthdayIntro({triggerAt:timing.triggerAt});
    return;
  }
  if(!timing.triggered){
    scheduleBirthdayIntroWatcher();
  }
}

function activateBdPhase(which){
  ['count','cake'].forEach(name=>{
    const el = document.getElementById(`bd-phase-${name}`);
    if(!el) return;
    const becoming = name === which;
    // 倒数 → 蛋糕：让倒数相快速退场（不拖住蛋糕登场）
    if(!becoming && which === 'cake'){
      el.style.transition = 'opacity 0.22s ease';
    } else {
      el.style.transition = '';
    }
    el.classList.toggle('active', becoming);
  });
}

function startBirthdayIntro({triggerAt = getBirthdayTimingState().triggerAt, force=false} = {}){
  if(BIRTHDAY_INTRO_STATE.started) return;
  const timing = getBirthdayTimingState();
  if(!force && !timing.inCountdown) return;
  const intro = document.getElementById('birthday-intro');
  if(!intro) return;
  intro.classList.remove('hidden','gone','celebrating');
  intro.style.display = 'flex';
  intro.setAttribute('aria-hidden','false');
  BIRTHDAY_INTRO_STATE.started = true;
  BIRTHDAY_INTRO_STATE.triggerAt = triggerAt;
  clearTimeout(BIRTHDAY_INTRO_STATE.scheduler);
  BIRTHDAY_INTRO_STATE.scheduler = 0;
  // 黑屏时候底层 starfield 看不见，pause 掉省算力
  window.BD_PAUSE_BACKGROUND = true;

  const cakePhase = document.getElementById('bd-phase-cake');
  if(cakePhase) cakePhase.classList.remove('blown');
  const celebrate = document.getElementById('bd-celebrate-layer');
  if(celebrate){
    celebrate.classList.remove('active');
    celebrate.setAttribute('aria-hidden','true');
    celebrate.innerHTML = '';
  }
  if(typeof BIRTHDAY_INTRO_STATE.cakeConfettiCleanup === 'function'){
    try{ BIRTHDAY_INTRO_STATE.cakeConfettiCleanup(); }catch(_e){}
    BIRTHDAY_INTRO_STATE.cakeConfettiCleanup = null;
  }

  // 跳过按钮
  const skipBtn = document.getElementById('bd-intro-skip');
  if(skipBtn && !skipBtn.dataset.bound){
    skipBtn.dataset.bound = '1';
    skipBtn.addEventListener('click', ()=>finishBirthdayIntro({fast:true}));
  }

  const countTitle = document.querySelector('.bd-count-title');
  if(countTitle){
    countTitle.textContent = `25 岁生日 · 倒数 ${BIRTHDAY_COUNTDOWN_SECONDS} 秒`;
  }
  activateBdPhase('count');
  runBirthdayCountdown(BIRTHDAY_INTRO_STATE.triggerAt).then(()=>{
    // 倒数一结束就开始放生日快乐 mp3，蛋糕+吹蜡烛的过程中一直在放
    playBirthdayMusic();
    activateBdPhase('cake');
    runBirthdayCakeConfetti();
    runBirthdayCake();
  });
}

function runBirthdayCountdown(triggerAt){
  const numEl = document.getElementById('bd-count-number');
  if(!numEl) return Promise.resolve();
  return new Promise(resolve=>{
    let lastShown = null;
    function paint(value){
      numEl.classList.remove('final');
      numEl.textContent = String(value);
      numEl.style.animation = 'none';
      void numEl.offsetWidth;
      numEl.style.animation = '';
      if(value === 0){
        numEl.classList.add('final');
      }
    }
    function tick(){
      const remainingMs = Math.max(0, triggerAt - Date.now());
      const remaining = Math.max(0, Math.ceil(remainingMs / 1000));
      if(remaining !== lastShown){
        lastShown = remaining;
        paint(remaining);
      }
      if(remainingMs <= 0){
        resolve();
        return;
      }
      window.setTimeout(tick, remaining > 1 ? 120 : 60);
    }
    tick();
  });
}

function runBirthdayCakeConfetti(){
  const layer = document.getElementById('bd-cake-confetti-layer');
  if(!layer) return;

  if(typeof BIRTHDAY_INTRO_STATE.cakeConfettiCleanup === 'function'){
    try{ BIRTHDAY_INTRO_STATE.cakeConfettiCleanup(); }catch(_e){}
  }

  layer.innerHTML = '';
  layer.classList.add('active');
  layer.setAttribute('aria-hidden','false');

  let destroyed = false;
  const palettes = [
    'linear-gradient(180deg, #fff1b8, #ffb36a)',
    'linear-gradient(180deg, #ffd8ec, #ff88bd)',
    'linear-gradient(180deg, #e5dcff, #bc7cff)',
    'linear-gradient(180deg, #d9f2ff, #82c9ff)',
    'linear-gradient(180deg, #fff6de, #ffd56a)'
  ];
  const kinds = ['rect','ribbon','flake'];

  function spawnBatch(count){
    for(let i=0;i<count;i++){
      const piece = document.createElement('span');
      const kind = kinds[Math.floor(Math.random()*kinds.length)];
      const size = kind === 'flake' ? (8 + Math.random()*8) : (8 + Math.random()*7);
      const height = kind === 'flake' ? size : (16 + Math.random()*16);
      const delay = Math.random()*180;
      const dur = 2800 + Math.random()*2200;
      const left = 2 + Math.random()*96;
      const drift = (Math.random()*180 - 90).toFixed(1) + 'px';
      const spin = (Math.random()*720 - 360).toFixed(1) + 'deg';
      const bg = palettes[Math.floor(Math.random()*palettes.length)];
      piece.className = `bd-cake-confetti ${kind}`;
      piece.style.setProperty('--left', `${left.toFixed(2)}%`);
      piece.style.setProperty('--w', `${size.toFixed(1)}px`);
      piece.style.setProperty('--h', `${height.toFixed(1)}px`);
      piece.style.setProperty('--delay', `${delay.toFixed(0)}ms`);
      piece.style.setProperty('--dur', `${dur.toFixed(0)}ms`);
      piece.style.setProperty('--drift', drift);
      piece.style.setProperty('--spin', spin);
      piece.style.setProperty('--bg', bg);
      layer.appendChild(piece);
      setTimeout(()=>piece.remove(), dur + delay + 260);
    }
  }

  spawnBatch(22);
  const interval = setInterval(()=>spawnBatch(10), 420);

  function cleanup(){
    if(destroyed) return;
    destroyed = true;
    clearInterval(interval);
    layer.classList.remove('active');
    layer.setAttribute('aria-hidden','true');
    setTimeout(()=>{
      if(destroyed){
        layer.innerHTML = '';
      }
    }, 520);
  }

  BIRTHDAY_INTRO_STATE.cakeConfettiCleanup = cleanup;
}

function runBirthdayCake(){
  const startBtn = document.getElementById('bd-cake-start');
  const status = document.getElementById('bd-cake-status');
  const meter = document.getElementById('bd-cake-meter');
  const cakePhase = document.getElementById('bd-phase-cake');
  if(!startBtn || !status || !meter) return;

  const flames = Array.from(document.querySelectorAll('#bd-phase-cake .bd-flame'));
  const totalCandles = 5;
  let extinguishedCount = 0;

  function setMeter(value){
    const pct = Math.max(4, Math.min(100, value * 100));
    meter.style.width = `${pct.toFixed(1)}%`;
  }

  function blowOutCandle(index){
    const flameEls = flames.filter(f=>String(f.dataset.flame) === String(index));
    flameEls.forEach(f=>f.classList.add('out'));
    // 烟雾效果
    const svg = document.querySelector('.bd-cake-svg');
    if(svg){
      const rect = flameEls[0]?.getBoundingClientRect();
      if(rect){
        for(let k=0;k<3;k++){
          const puff = document.createElement('div');
          puff.className = 'bd-smoke';
          puff.style.left = `${rect.left + rect.width/2 - 3 + (k-1)*3}px`;
          puff.style.top = `${rect.top + rect.height/2}px`;
          puff.style.animationDelay = `${k*120}ms`;
          document.body.appendChild(puff);
          setTimeout(()=>puff.remove(), 1800);
        }
      }
    }
  }

  function onBlowDetected(){
    if(extinguishedCount >= totalCandles) return;
    blowOutCandle(extinguishedCount);
    extinguishedCount += 1;
    setMeter(extinguishedCount / totalCandles);
    if(extinguishedCount >= totalCandles){
      cakePhase && cakePhase.classList.add('blown');
      status.textContent = '愿望已许下 · 蛋糕先替你保密一下';
      setTimeout(()=>finishBirthdayIntro({fast:false}), 1500);
    }else{
      const left = totalCandles - extinguishedCount;
      status.textContent = `还剩 ${left} 根蜡烛，再用力吹一下`;
    }
  }

  async function armMic(){
    startBtn.disabled = true;
    status.textContent = '正在请求麦克风权限 …';
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      status.textContent = '浏览器不支持麦克风 · 点下方"跳过"继续';
      startBtn.disabled = false;
      return;
    }
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}
      });
    }catch(_e){
      status.textContent = '未获得麦克风权限 · 点下方"跳过"可继续进入地图';
      startBtn.disabled = false;
      return;
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    if(ctx.state === 'suspended'){ try{ await ctx.resume(); }catch(_e){} }
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.3;
    source.connect(analyser);
    const data = new Uint8Array(analyser.fftSize);

    let baselineDb = -58;
    let smoothedDb = -100;
    let activeFrames = 0;
    let charge = 0;
    const perCandleCharge = 1.3; // 每根蜡烛需要积累的吹气能量
    const calibration = [];
    let frameCount = 0;
    let rafId = 0;
    let destroyed = false;

    function cleanup(){
      destroyed = true;
      if(rafId) cancelAnimationFrame(rafId);
      try{source.disconnect();}catch(_e){}
      try{analyser.disconnect();}catch(_e){}
      stream.getTracks().forEach(t=>t.stop());
      ctx.close().catch(()=>{});
    }
    BIRTHDAY_INTRO_STATE.micCleanup = cleanup;

    function tick(){
      if(destroyed) return;
      analyser.getByteTimeDomainData(data);
      let sum=0, peak=0;
      for(let i=0;i<data.length;i++){
        const n = (data[i]-128)/128;
        const abs = Math.abs(n);
        sum += n*n;
        if(abs>peak) peak = abs;
      }
      const rms = Math.sqrt(sum/data.length);
      let rmsDb = rms>0 ? 20*Math.log10(rms) : -100;
      let peakDb = peak>0 ? 20*Math.log10(peak) : -100;
      if(!Number.isFinite(rmsDb)) rmsDb=-100;
      if(!Number.isFinite(peakDb)) peakDb=-100;
      const db = Math.max(rmsDb, peakDb-10);
      smoothedDb = smoothedDb<=-99 ? db : (smoothedDb*0.82 + db*0.18);
      const sensedDb = Math.max(db, smoothedDb);
      frameCount++;

      if(calibration.length < 30){
        calibration.push(sensedDb);
        const sorted = [...calibration].sort((a,b)=>a-b);
        baselineDb = Math.max(-72, Math.min(-24, sorted[Math.floor(sorted.length/2)]));
        status.textContent = '校准中 · 请先安静半秒 …';
        rafId = requestAnimationFrame(tick);
        return;
      }

      const triggerDb = Math.min(-30, Math.max(-42, baselineDb + 14));
      const deltaDb = sensedDb - baselineDb;
      const detected = sensedDb >= triggerDb && deltaDb >= 12;

      if(detected){
        activeFrames = Math.min(18, activeFrames+1);
      }else{
        activeFrames = Math.max(0, activeFrames-2);
        baselineDb = Math.max(-72, Math.min(-24, baselineDb*0.992 + Math.min(sensedDb, baselineDb+1.2)*0.008));
      }

      if(activeFrames >= 4){
        const boost = 0.02 + Math.min(0.02, Math.max(0, deltaDb-12)/220);
        charge += boost;
      }else{
        charge = Math.max(0, charge - 0.012);
      }

      if(charge >= perCandleCharge){
        charge = 0;
        onBlowDetected();
      }

      const progressThisCandle = Math.min(1, charge/perCandleCharge);
      const overall = (extinguishedCount + progressThisCandle) / totalCandles;
      setMeter(overall);

      const shown = Math.max(-60, Math.round(sensedDb));
      if(extinguishedCount < totalCandles){
        if(activeFrames >= 4){
          status.textContent = `感受到气流 ${shown} dB · 火苗在抖，继续吹`;
        }else if(frameCount > 120 && activeFrames < 2){
          status.textContent = `把嘴凑近麦克风再用点力（目标 ${Math.round(triggerDb)} dB）`;
        }else{
          status.textContent = `当前 ${shown} dB · 对着麦克风持续吹气`;
        }
      }

      rafId = requestAnimationFrame(tick);
    }
    status.textContent = '麦克风已连接 · 准备吹气';
    tick();
  }

  startBtn.addEventListener('click', armMic, {once:true});
}

function finishBirthdayIntro({fast=false} = {}){
  if(BIRTHDAY_INTRO_STATE.done) return;
  BIRTHDAY_INTRO_STATE.done = true;
  markBirthdayIntroDone();
  // 关掉麦克风
  if(typeof BIRTHDAY_INTRO_STATE.micCleanup === 'function'){
    try{ BIRTHDAY_INTRO_STATE.micCleanup(); }catch(_e){}
    BIRTHDAY_INTRO_STATE.micCleanup = null;
  }
  if(typeof BIRTHDAY_INTRO_STATE.cakeConfettiCleanup === 'function'){
    try{ BIRTHDAY_INTRO_STATE.cakeConfettiCleanup(); }catch(_e){}
    BIRTHDAY_INTRO_STATE.cakeConfettiCleanup = null;
  }
  // 所有火苗瞬间灭掉，确保视觉一致
  document.querySelectorAll('#bd-phase-cake .bd-flame').forEach(f=>f.classList.add('out'));
  const cakePhase = document.getElementById('bd-phase-cake');
  if(cakePhase) cakePhase.classList.add('blown');
  // 触发烟花（音乐在倒数结束时已开始播）
  // 如果是用户点了"跳过"，音乐还没开始，这里补一次
  if(!BIRTHDAY_INTRO_STATE.audio){
    playBirthdayMusic();
  }
  const celebrationDuration = fast ? 3600 : 6200;
  const fadeDelay = fast ? 2100 : 4600;
  const fadeDuration = 1900;
  runBirthdayFireworks(celebrationDuration);
  runBirthdayCelebration(celebrationDuration);
  // 淡出整个开场
  const intro = document.getElementById('birthday-intro');
  if(!intro) return;
  intro.classList.add('celebrating');
  setTimeout(()=>{
    intro.classList.add('hidden');
    setTimeout(()=>{
      intro.classList.add('gone');
      intro.setAttribute('aria-hidden','true');
      intro.style.display = 'none';
      intro.classList.remove('celebrating');
      document.querySelectorAll('.bd-phase').forEach(el=>el.classList.remove('active'));
      if(BIRTHDAY_INTRO_STATE.fwAnim){
        cancelAnimationFrame(BIRTHDAY_INTRO_STATE.fwAnim);
        BIRTHDAY_INTRO_STATE.fwAnim = 0;
      }
      if(typeof BIRTHDAY_INTRO_STATE.celebrateCleanup === 'function'){
        try{ BIRTHDAY_INTRO_STATE.celebrateCleanup(); }catch(_e){}
        BIRTHDAY_INTRO_STATE.celebrateCleanup = null;
      }
      // 开场彻底结束，让底下的 starfield 恢复动画
      window.BD_PAUSE_BACKGROUND = false;
    }, Math.max(fadeDuration, celebrationDuration - fadeDelay + 420));
  }, fadeDelay);
}

function playBirthdayMusic(){
  if(BIRTHDAY_INTRO_STATE.audio) return; // 防止重复
  try{
    const audio = new Audio('./生日快乐.mp3');
    audio.volume = 0.85;
    audio.preload = 'auto';
    BIRTHDAY_INTRO_STATE.audio = audio;
    BACKGROUND_MUSIC_STATE.requested = true;
    BACKGROUND_MUSIC_STATE.started = true;
    BACKGROUND_MUSIC_STATE.currentIndex = 0;
    BACKGROUND_MUSIC_STATE.resumeIndex = 1;
    BACKGROUND_MUSIC_STATE.resumeTime = 0;
    audio._homeHandoffListener = ()=>{
      if(BIRTHDAY_INTRO_STATE.audio !== audio) return;
      BIRTHDAY_INTRO_STATE.audio = null;
      BACKGROUND_MUSIC_STATE.resumeIndex = 1;
      BACKGROUND_MUSIC_STATE.resumeTime = 0;
      if(FINAL_LETTER_AUDIO_STATE.active){
        return;
      }
      startHomePlaylistAt(1, 0);
    };
    audio.addEventListener('ended', audio._homeHandoffListener);
    const attempt = audio.play();
    if(attempt && typeof attempt.catch === 'function'){
      attempt.catch(()=>{
        // 倒数结束时还没有任何用户手势，某些浏览器会拦下自动播放。
        // 挂一个一次性监听：用户下一次任意点击/按键/触屏时立刻重放。
        const retry = ()=>{
          audio.play().catch(()=>{});
          window.removeEventListener('click', retry, true);
          window.removeEventListener('touchstart', retry, true);
          window.removeEventListener('keydown', retry, true);
        };
        window.addEventListener('click', retry, true);
        window.addEventListener('touchstart', retry, true);
        window.addEventListener('keydown', retry, true);
      });
    }
  }catch(_e){}
}

function runBirthdayFireworks(durationMs=4600){
  const cvs = document.getElementById('bd-fireworks');
  if(!cvs) return;
  const ctx = cvs.getContext('2d', {alpha:true, desynchronized:true});
  // 限制 DPR：高 DPR 下像素量 4 倍，对烟花帧率伤害大；这里压到 1.5
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  let w = 0, h = 0;

  function resize(){
    w = innerWidth;
    h = innerHeight;
    cvs.style.width = w + 'px';
    cvs.style.height = h + 'px';
    cvs.width = Math.floor(w * dpr);
    cvs.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // === 预渲染贴图 ===
  // 每种颜色生成一张 32x32 的径向渐变贴图，运行期只需 drawImage，
  // 不再调 shadowBlur/beginPath/arc（旧版这里是 60fps 大杀手）。
  const palette = [
    '#fff3c4','#ffd27a','#ff9a5a',
    '#ffd6ec','#ff7eb8','#c274ff',
    '#d8e4ff','#9cc2ff','#7b6bff',
    '#ffe0c2','#ffbe84','#ff7a7a',
    '#fff0e0','#ffd04a','#ffaa44'
  ];
  const SPRITE_SIZE = 32;
  const sprites = palette.map(color=>{
    const s = document.createElement('canvas');
    s.width = s.height = SPRITE_SIZE;
    const sctx = s.getContext('2d');
    const r = SPRITE_SIZE / 2;
    const g = sctx.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0.00, 'rgba(255,255,255,1)');
    g.addColorStop(0.22, color);
    g.addColorStop(0.60, color + '66');
    g.addColorStop(1.00, color + '00');
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, SPRITE_SIZE, SPRITE_SIZE);
    return s;
  });

  // 上限保护：粒子数爆炸时直接丢弃新爆炸
  const MAX_PARTICLES = 480;
  // 用对象池，避免频繁 GC
  const particles = new Array(MAX_PARTICLES).fill(null).map(()=>({alive:false}));

  function spawn(x, y, vx, vy, spriteIdx, size, decay){
    for(let i=0;i<MAX_PARTICLES;i++){
      const p = particles[i];
      if(!p.alive){
        p.alive = true;
        p.x = x; p.y = y;
        p.vx = vx; p.vy = vy;
        p.life = 1;
        p.decay = decay;
        p.sprite = spriteIdx;
        p.size = size;
        return;
      }
    }
  }

  function burst(cx, cy){
    // 同一次爆炸只用两种相邻颜色，视觉一致且贴图切换少
    const baseIdx = Math.floor(Math.random()*palette.length);
    const altIdx  = (baseIdx + 1) % palette.length;
    const count = 48 + Math.floor(Math.random()*22); // 48-70，比之前更克制
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 1.8 + Math.random()*4.2;
      const sprite = Math.random() < 0.75 ? baseIdx : altIdx;
      spawn(
        cx, cy,
        Math.cos(angle)*speed,
        Math.sin(angle)*speed,
        sprite,
        0.45 + Math.random()*0.5,
        0.014 + Math.random()*0.011
      );
    }
  }

  const start = performance.now();
  let lastBurst = 0;
  let scheduledExtra = 0;

  function frame(now){
    const elapsed = now - start;
    // 用半透明黑代替 clearRect 可以留一点尾迹；这里选 clear 更干净且更快
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';

    if(elapsed < durationMs && now - lastBurst > 300){
      lastBurst = now;
      burst(w*(0.18 + Math.random()*0.64), h*(0.22 + Math.random()*0.4));
      // 偶尔连爆，用 rAF 计数器代替 setTimeout 避免额外定时器
      if(Math.random() < 0.3){
        scheduledExtra = now + 140;
      }
    }
    if(scheduledExtra && now >= scheduledExtra){
      burst(w*(0.2 + Math.random()*0.6), h*(0.2 + Math.random()*0.4));
      scheduledExtra = 0;
    }

    // 更新 + 绘制
    let aliveCount = 0;
    for(let i=0;i<MAX_PARTICLES;i++){
      const p = particles[i];
      if(!p.alive) continue;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.vx *= 0.99;
      p.life -= p.decay;
      if(p.life <= 0){
        p.alive = false;
        continue;
      }
      aliveCount++;
      const sz = SPRITE_SIZE * p.size * (0.4 + p.life*0.6);
      ctx.globalAlpha = p.life;
      ctx.drawImage(sprites[p.sprite], p.x - sz*0.5, p.y - sz*0.5, sz, sz);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if(elapsed < durationMs + 3200 || aliveCount > 0){
      BIRTHDAY_INTRO_STATE.fwAnim = requestAnimationFrame(frame);
    }else{
      removeEventListener('resize', resize);
    }
  }
  BIRTHDAY_INTRO_STATE.fwAnim = requestAnimationFrame(frame);
}

function runBirthdayCelebration(durationMs=5200){
  const layer = document.getElementById('bd-celebrate-layer');
  if(!layer) return;

  if(typeof BIRTHDAY_INTRO_STATE.celebrateCleanup === 'function'){
    try{ BIRTHDAY_INTRO_STATE.celebrateCleanup(); }catch(_e){}
  }

  layer.innerHTML = '';
  layer.classList.add('active');
  layer.setAttribute('aria-hidden', 'false');

  let destroyed = false;
  const kinds = ['orb','diamond','streak'];

  function spawnBatch(count){
    for(let i=0;i<count;i++){
      const piece = document.createElement('span');
      const kind = kinds[Math.floor(Math.random()*kinds.length)];
      const size = kind === 'streak'
        ? 12 + Math.random()*10
        : 10 + Math.random()*14;
      const delay = Math.random()*220;
      const dur = 2900 + Math.random()*1800;
      const left = 6 + Math.random()*88;
      const drift = (Math.random()*220 - 110).toFixed(1) + 'px';
      const spin = (Math.random()*240 - 120).toFixed(1) + 'deg';
      piece.className = `bd-celebrate-piece ${kind}`;
      piece.style.setProperty('--left', `${left.toFixed(2)}%`);
      piece.style.setProperty('--size', `${size.toFixed(1)}px`);
      piece.style.setProperty('--delay', `${delay.toFixed(0)}ms`);
      piece.style.setProperty('--dur', `${dur.toFixed(0)}ms`);
      piece.style.setProperty('--drift', drift);
      piece.style.setProperty('--spin', spin);
      layer.appendChild(piece);
      setTimeout(()=>piece.remove(), dur + delay + 260);
    }
  }

  spawnBatch(16);
  const interval = setInterval(()=>spawnBatch(8), 520);
  const stopTimer = setTimeout(cleanup, durationMs);

  function cleanup(){
    if(destroyed) return;
    destroyed = true;
    clearInterval(interval);
    clearTimeout(stopTimer);
    layer.classList.remove('active');
    layer.setAttribute('aria-hidden', 'true');
    setTimeout(()=>{
      if(destroyed){
        layer.innerHTML = '';
      }
    }, 620);
  }

  BIRTHDAY_INTRO_STATE.celebrateCleanup = cleanup;
}

// 启动判定
if(document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(()=>{
    FINAL_LETTER_TRIGGERED = isFinalLetterAvailable();
    FINAL_LETTER_PENDING_REVEAL = false;
    updateTitleHeartEntrances();
    scheduleBirthdayIntroWatcher();
    maybeStartBirthdayIntroFromTiming();
    tickClock();
  }, 120);
}else{
  document.addEventListener('DOMContentLoaded', ()=>{
    setTimeout(()=>{
      FINAL_LETTER_TRIGGERED = isFinalLetterAvailable();
      FINAL_LETTER_PENDING_REVEAL = false;
      updateTitleHeartEntrances();
      scheduleBirthdayIntroWatcher();
      maybeStartBirthdayIntroFromTiming();
      tickClock();
    }, 120);
  }, {once:true});
}
